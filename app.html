    wrap.innerHTML = roles.map(function(role) {
      var checked = selectedRoles.indexOf(role.discord_role_id) >= 0;
      return '<label class="wp-chip"><input type="checkbox" class="pm-role-cb" value="'+role.discord_role_id+'" '+(checked?'checked':'')+'>' + role.name + '</label>';
    }).join('');
  });


  document.getElementById('pm-save-btn').addEventListener('click', function() {
    var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
    var id = isNew ? document.getElementById('pm-id').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-') : p.id;
    if (!id) { tst('El ID del plan es obligatorio', 1); btn.disabled = false; btn.textContent = 'Crear plan'; return; }
    var roleIds = Array.prototype.slice.call(document.querySelectorAll('.pm-role-cb:checked')).map(function(el){ return el.value; });
    var data = {
      id: id,
      name: document.getElementById('pm-name').value.trim(),
      description: document.getElementById('pm-desc').value.trim(),
      price: parseFloat(document.getElementById('pm-price').value) || 0,
      period: document.getElementById('pm-period').value.trim(),
      label: document.getElementById('pm-label').value.trim(),
      color: document.getElementById('pm-color').value,
      duration_clases_months: document.getElementById('pm-dur-clases').value ? parseInt(document.getElementById('pm-dur-clases').value) : null,
      access_clases: document.getElementById('pm-clases').checked,
      duration_live_months: document.getElementById('pm-live').checked ? (document.getElementById('pm-dur-live').value ? parseInt(document.getElementById('pm-dur-live').value) : null) : null,
      category: document.querySelector('input[name="pm-category"]:checked').value,
      roadmap_mode: document.getElementById('pm-roadmap').value,
      access_1on1: document.getElementById('pm-1on1').checked,
      popular: document.getElementById('pm-popular').checked,
      discord_role_ids: roleIds
    };
    var n1 = document.getElementById('pm-1on1-n');
    if (n1 && n1.value !== '') data.sessions_1on1 = parseInt(n1.value, 10);
    if (isNew) { data.active = false; data.sort_order = (window._allPlans || []).length; }

    var op = isNew ? sb.from('checkout_plans').insert(data) : sb.from('checkout_plans').update(data).eq('id', id);
    op.then(function(r) {
      if (r.error) { tst('Error: ' + r.error.message, 1); btn.disabled = false; btn.textContent = isNew ? 'Crear plan' : 'Guardar cambios'; return; }

      var applyExisting = !isNew && document.getElementById('pm-apply-existing') && document.getElementById('pm-apply-existing').checked;
      if (applyExisting) {
        var nowISO = new Date().toISOString();
        var promises = [];

        // 1-a-1 y roadmap: a TODOS los alumnos de este plan, sin excepción (no tienen vencimiento)
        promises.push(sb.from('profiles').update({
          access_1on1: data.access_1on1,
          roadmap_mode: data.roadmap_mode
        }).eq('plan', id));

        // Clases: solo a quienes tienen acceso ACTIVO ahora mismo (no revive a quien ya venció)
        var clasesUpdate;
        if (data.access_clases === false) {
          clasesUpdate = { membership_start: null, membership_end: null };
        } else {
          var clasesEnd = data.duration_clases_months
            ? (function(){ var e = new Date(); e.setMonth(e.getMonth() + data.duration_clases_months); return e.toISOString(); })()
            : UNLIMITED_ISO;
          clasesUpdate = { membership_start: new Date().toISOString(), membership_end: clasesEnd };
        }
        promises.push(sb.from('profiles').update(clasesUpdate).eq('plan', id).gt('membership_end', nowISO));

        // Live NUNCA se toca aquí — ni activo ni vencido. Es un servicio recurrente con
        // valor monetario real; extenderlo o reactivarlo sin que el alumno haya pagado
        // de nuevo no sería justo. Si el plan cambia su duración de Live, eso solo aplica
        // a quienes lo obtengan de ahora en adelante (compra, código, o asignación manual).

        Promise.all(promises).then(function(results) {
          modal.remove();
          var anyError = results.some(function(r){ return r.error; });
          if (anyError) tst('Plan guardado, pero algo falló al aplicar a alumnos existentes', 1);
          else tst('✓ Plan actualizado y aplicado a alumnos activos');
          loadPlansAdmin();
        });
      } else {
        tst(isNew ? '✓ Plan creado (queda oculto — actívalo cuando esté listo)' : '✓ Plan actualizado');
        modal.remove();
        loadPlansAdmin();
      }
    });
  });

  if (!isNew) {
    document.getElementById('pm-delete-btn').addEventListener('click', function() {
      if (!confirm('¿Eliminar el plan "'+p.name+'"? Esto no afecta a los alumnos que ya lo tienen asignado, solo deja de estar disponible para nuevos.')) return;
      sb.from('checkout_plans').delete().eq('id', p.id).then(function(r) {
        if (r.error) return tst('Error: ' + r.error.message, 1);
        tst('✓ Plan eliminado');
        modal.remove();
        loadPlansAdmin();
      });
    });
  }
}

function _toggleCodeType(type) {
  document.getElementById('code-free-block').style.display = type === 'free' ? '' : 'none';
  document.getElementById('code-discount-block').style.display = type === 'discount' ? '' : 'none';
  document.getElementById('code-plan-label').textContent = type === 'free' ? 'Plan que activa' : 'Plan al que aplica el descuento';
}

function genCode() {
  var note = document.getElementById('code-note').value.trim();
  var plan = document.getElementById('code-plan') ? document.getElementById('code-plan').value : '';
  var codeType = document.querySelector('input[name="code-type"]:checked').value;
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = 'KATANA-';
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];

  var data = { code: code, created_by: cUser.id, plan: plan, notes: note, code_type: codeType };

  if (codeType === 'free') {
    var customDur = document.getElementById('code-custom-dur').checked;
    data.custom_duration = customDur;
    if (customDur) {
      var appliesClases = document.getElementById('code-applies-clases').checked;
      var appliesLive = document.getElementById('code-applies-live').checked;
      var months = parseInt(document.getElementById('code-months').value) || 1;
      data.applies_clases = appliesClases;
      data.applies_live = appliesLive;
      data.months = months; // se guarda igual, para compatibilidad con lecturas existentes
    } else {
      data.applies_clases = false;
      data.applies_live = false;
      data.months = null;
    }
  } else {
    data.discount_type = document.getElementById('code-discount-type').value;
    data.discount_value = parseFloat(document.getElementById('code-discount-value').value) || 0;
  }

  sb.from('access_codes').insert(data).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Código generado: ' + code);
    loadCodes();
  });
}

function dCode(id) {
  if (!confirm('¿Eliminar este código de acceso?')) return;
  sb.from('access_codes').delete().eq('id', id).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Código eliminado');
    loadCodes();
  });
}
function loadCodes() {
  var c = document.getElementById('codes-list'); if (!c) return;
  sb.from('access_codes').select('*').order('created_at', {ascending: false}).then(function(r) {
    if (!r.data || !r.data.length) { c.innerHTML = '<p style="color:var(--c-muted);font-size:.82rem;">Sin códigos generados aún.</p>'; return; }
    var tbl = document.createElement('table'); tbl.className = 'dtab';
    tbl.innerHTML = '<thead><tr><th>Código</th><th>Nota</th><th>Detalle</th><th>Estado</th><th>Usado</th><th></th></tr></thead>';
    var tb = document.createElement('tbody');
    r.data.forEach(function(cd) {
      var tr = document.createElement('tr');
      var usedDate = cd.used_at ? new Date(cd.used_at).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : '—';
      var detail;
      if (cd.code_type === 'discount') {
        detail = '<span style="color:rgb(var(--c-acc));">' + (cd.discount_type === 'percent' ? cd.discount_value + '% off' : '$' + cd.discount_value + ' off') + '</span>';
      } else if (cd.custom_duration) {
        var parts = [];
        if (cd.applies_clases) parts.push('Clases');
        if (cd.applies_live) parts.push('Live');
        detail = cd.months + ' mes' + (cd.months===1?'':'es') + ' (' + (parts.join(' + ') || '—') + ')';
      } else {
        detail = 'Duración del plan';
      }
      tr.innerHTML =
        '<td><span style="font-family:monospace;font-size:.82rem;color:var(--c-text);letter-spacing:1px;">' + cd.code + '</span>' +
        '<button onclick="navigator.clipboard.writeText(\'' + cd.code + '\').then(function(){tst(\'✓ Copiado\')})" style="background:none;border:none;color:var(--c-muted);cursor:pointer;font-size:.7rem;margin-left:6px;padding:2px 5px;border:1px solid var(--br);border-radius:3px;">Copiar</button></td>' +
        '<td style="font-size:.74rem;color:var(--c-muted);">' + (cd.notes || '—') + '</td>' +
        '<td style="font-size:.74rem;">' + detail + '</td>' +
        '<td><span style="font-size:.68rem;padding:2px 8px;border-radius:3px;background:' + (cd.is_used ? 'rgba(var(--c-bad),.1)' : 'rgba(var(--c-ok),.1)') + ';color:' + (cd.is_used ? 'rgb(var(--c-bad))' : 'rgb(var(--c-ok))') + ';">' + (cd.is_used ? 'Usado' : 'Disponible') + '</span></td>' +
        '<td style="font-size:.74rem;color:var(--c-muted);">' + usedDate + '</td>' +
        '<td></td>';
      {
        var delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.style.cssText = 'background:rgba(var(--c-bad),.08);border:1px solid rgba(var(--c-bad),.18);color:rgb(var(--c-bad));padding:3px 9px;border-radius:2px;font-size:.71rem;cursor:pointer;';
        delBtn.addEventListener('click', function() { dCode(cd.id); });
        tr.cells[tr.cells.length-1].appendChild(delBtn);
      }
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    c.innerHTML = '';
    var w = document.createElement('div'); w.className = 'dtab-wrap'; w.appendChild(tbl); c.appendChild(w);
  });
}

function rAdmSe() {
  var c = document.getElementById('a-se'); if (!c) return;
  c.innerHTML =
    '<div class="aform">' +
      '<div style="font-size:.86rem;font-weight:600;margin-bottom:14px;">➕ Programar sesión</div>' +
      '<div style="margin-bottom:9px;">' +
        '<label class="al">Título</label><input id="s-t" class="ai" placeholder="Pre-Market ES Futuros">' +
      '</div>' +
      '<div class="ses-dt-grid">' +
        '<div><label class="al">Inicio</label><input id="s-d" type="datetime-local" class="ai ses-dt-input"></div>' +
        '<div><label class="al">Fin (auto-desactivar)</label><input id="s-end" type="datetime-local" class="ai ses-dt-input"></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;">' +
        '<div><label class="al">Link Discord</label><input id="s-u" class="ai" placeholder="https://discord.gg/..."></div>' +
        '<div><label class="al">Descripción</label><input id="s-desc" class="ai" placeholder="Descripción opcional"></div>' +
      '</div>' +
      '<div style="display:flex;gap:11px;align-items:center;margin-top:11px;">' +
        '<button onclick="cSe()" class="abtn2">Programar</button>' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--c-text2);cursor:pointer;"><input type="checkbox" id="s-act"> Activar ahora</label>' +
      '</div>' +
    '</div>' +
    '<div id="se-t"><span class="spin"></span></div>';

  sb.from('live_sessions').select('*').order('scheduled_at', {ascending: false}).then(function(r) {
    var t = document.getElementById('se-t'); if (!t) return;
    if (!r.data || !r.data.length) {
      t.innerHTML = '<p style="color:var(--c-muted);padding:14px 0;font-size:.82rem;">Sin sesiones.</p>';
      return;
    }

    t.innerHTML = '';
    var now = new Date();

    // Split into upcoming and past
    var upcoming = r.data.filter(function(s){ return new Date(s.scheduled_at) >= now || s.is_active; });
    var past     = r.data.filter(function(s){ return new Date(s.scheduled_at) < now && !s.is_active; });

    // ── Render a paginated list into a container ──
    function renderPaginatedList(container, items, pageSize) {
      var page = 0;
      function render() {
        var slice = items.slice(0, (page + 1) * pageSize);
        var hasMore = items.length > slice.length;
        container.innerHTML = '';
        slice.forEach(function(s) {
          var card = document.createElement('div');
          card.id = 'ses-card-' + s.id;
          card.style.cssText = 'background:rgba(var(--c-ov),.02);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:10px;';
          var dateStr = new Date(s.scheduled_at).toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
          var timeStr = new Date(s.scheduled_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
          card.innerHTML =
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;">' +
              '<div>' +
                '<div style="font-size:.86rem;font-weight:600;color:var(--c-text);">' + (s.title||'') + '</div>' +
                '<div style="font-size:.72rem;color:var(--c-muted);margin-top:2px;">' + dateStr + ' · ' + timeStr + '</div>' +
                (s.description ? '<div style="font-size:.72rem;color:var(--c-muted);margin-top:2px;">' + s.description + '</div>' : '') +
              '</div>' +
              '<label style="cursor:pointer;display:flex;align-items:center;gap:5px;font-size:.72rem;color:' + (s.is_active?'rgb(var(--c-ok))':'var(--c-muted)') + ';flex-shrink:0;">' +
                '<input type="checkbox" ' + (s.is_active?'checked':'') + ' data-id="' + s.id + '" onchange="togSe(this.dataset.id, this.checked)"> ' +
                (s.is_active ? 'Activo' : 'Inactivo') +
              '</label>' +
            '</div>' +
            '<div style="margin-bottom:10px;">' +
              '<label class="al">URL Grabación (YouTube)</label>' +
              '<div style="display:flex;gap:8px;">' +
                '<input id="rec-' + s.id + '" class="ai" style="flex:1;" placeholder="https://youtube.com/embed/..." value="' + (s.recording_url||'') + '">' +
                '<button onclick="saveRec(this.dataset.id)" data-id="' + s.id + '" style="background:rgba(var(--c-acc),.12);border:1px solid rgba(var(--c-acc),.25);color:var(--sl);padding:6px 12px;border-radius:6px;font-size:.72rem;cursor:pointer;white-space:nowrap;">Guardar</button>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex;gap:8px;">' +
              '<button onclick="openEditSe(this.dataset.id)" data-id="' + s.id + '" style="flex:1;background:rgba(var(--c-acc),.1);border:1px solid rgba(var(--c-acc),.2);color:var(--sl);padding:6px;border-radius:6px;font-size:.72rem;cursor:pointer;">✎ Editar</button>' +
              '<button onclick="dSe(this.dataset.id)" data-id="' + s.id + '" style="background:rgba(var(--c-bad),.08);border:1px solid rgba(var(--c-bad),.18);color:rgb(var(--c-bad));padding:6px 12px;border-radius:6px;font-size:.72rem;cursor:pointer;">✕</button>' +
            '</div>';
          container.appendChild(card);
        });
        // Ver más button
        var oldBtn = container.querySelector('.ses-more-btn');
        if (oldBtn) oldBtn.remove();
        if (hasMore) {
          var btn = document.createElement('button');
          btn.className = 'ses-more-btn';
          btn.textContent = 'Ver 5 más ↓';
          btn.style.cssText = 'width:100%;padding:10px;margin-top:4px;background:rgba(var(--c-acc),.08);border:1px solid rgba(var(--c-acc),.2);color:var(--sl);border-radius:8px;font-size:.78rem;cursor:pointer;';
          btn.addEventListener('click', function(){ page++; render(); });
          container.appendChild(btn);
        }
      }
      render();
    }

    // ── PRÓXIMAS SESIONES ──
    var upcomingWrap = document.createElement('div');
    upcomingWrap.style.cssText = 'margin-bottom:20px;';
    var upcomingLabel = document.createElement('div');
    upcomingLabel.style.cssText = 'font-size:.68rem;color:var(--c-text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--br);';
    upcomingLabel.textContent = 'Próximas sesiones';
    upcomingWrap.appendChild(upcomingLabel);
    if (upcoming.length) {
      renderPaginatedList(upcomingWrap, upcoming, 5);
    } else {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--c-muted);font-size:.8rem;padding:10px 0;';
      empty.textContent = 'Sin sesiones próximas.';
      upcomingWrap.appendChild(empty);
    }
    t.appendChild(upcomingWrap);

    // ── SESIONES PASADAS (colapsable) ──
    var pastWrap = document.createElement('div');
    var pastHeader = document.createElement('div');
    pastHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-top:1px solid var(--br);margin-bottom:0;';
    pastHeader.innerHTML =
      '<div style="font-size:.68rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:1.5px;">Sesiones pasadas / grabaciones (' + past.length + ')</div>' +
      '<svg id="past-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" style="transition:.2s;"><path d="M6 9l6 6 6-6"/></svg>';
    var pastList = document.createElement('div');
    pastList.id = 'past-ses-list';
    pastList.style.display = 'none';
    pastHeader.addEventListener('click', function() {
      var open = pastList.style.display !== 'none';
      pastList.style.display = open ? 'none' : 'block';
      var arrow = document.getElementById('past-arrow');
      if (arrow) arrow.style.transform = open ? '' : 'rotate(180deg)';
      if (!open && !pastList.dataset.loaded) {
        pastList.dataset.loaded = '1';
        renderPaginatedList(pastList, past, 5);
      }
    });
    pastWrap.appendChild(pastHeader);
    pastWrap.appendChild(pastList);
    t.appendChild(pastWrap);
  });

function toggleActMenu(btn) {
  document.querySelectorAll('.act-menu').forEach(function(m) {
    if (m !== btn.nextElementSibling) m.style.display = 'none';
  });
  var menu = btn.nextElementSibling;
  if (!menu) return;
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }

  // Render offscreen to measure
  menu.style.cssText = menu.style.cssText + ';position:fixed;visibility:hidden;display:block;top:-9999px;left:-9999px;';
  var menuH = menu.offsetHeight || 88;
  var menuW = menu.offsetWidth  || 150;

  var rect      = btn.getBoundingClientRect();
  // Mobile nav bar is 58px; add 8px safety margin
  var safeBottom = window.innerHeight - (window.innerWidth <= 860 ? 68 : 12);
  var spaceBelow = safeBottom - rect.bottom;
  var top  = spaceBelow >= menuH + 4 ? rect.bottom + 4 : rect.top - menuH - 4;
  var left = Math.max(8, Math.min(rect.right - menuW, window.innerWidth - menuW - 8));

  menu.style.top        = top  + 'px';
  menu.style.left       = left + 'px';
  menu.style.visibility = 'visible';
}

// ── PULL TO REFRESH ──
(function() {
  var PTR_THRESHOLD = 80;   // px to pull before triggering reload
  var PTR_MAX       = 120;  // max visual pull distance

  var el        = null;  // #appdash — set after DOM ready
  var indicator = null;
  var label     = null;
  var startY    = 0;
  var pulling   = false;
  var triggered = false;
  var currentPull = 0;

  function init() {
    el        = document.getElementById('appdash');
    indicator = document.getElementById('ptr-indicator');
    label     = document.getElementById('ptr-label');
    if (!el || !indicator) return;

    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove',  onTouchMove,  { passive: false });
    el.addEventListener('touchend',   onTouchEnd,   { passive: true });
  }

  function onTouchStart(e) {
    // Only activate when already scrolled to the very top
    if (el.scrollTop > 2) return;
    startY   = e.touches[0].clientY;
    pulling  = true;
    triggered = false;
    currentPull = 0;
  }

  function onTouchMove(e) {
    if (!pulling) return;
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pulling = false; resetIndicator(); return; }
    // Only cancel native scroll when we're pulling down from top
    if (el.scrollTop <= 2 && dy > 0) {
      e.preventDefault(); // prevent native scroll interference
    }
    currentPull = Math.min(dy * 0.5, PTR_MAX); // dampen
    setIndicatorHeight(currentPull);

    if (currentPull >= PTR_THRESHOLD) {
      indicator.classList.add('ptr-ready');
      label.textContent = 'Suelta para recargar';
      triggered = true;
    } else {
      indicator.classList.remove('ptr-ready');
      label.textContent = 'Baja para recargar';
      triggered = false;
    }
  }

  function onTouchEnd() {
    if (!pulling) return;
    pulling = false;
    if (triggered) {
      // Show loading state briefly then reload
      indicator.classList.add('ptr-loading');
      label.textContent = 'Recargando...';
      setIndicatorHeight(56);
      setTimeout(function() { location.reload(); }, 400);
    } else {
      resetIndicator();
    }
  }

  function setIndicatorHeight(h) {
    if (!indicator) return;
    indicator.style.height = h + 'px';
    var inner = document.getElementById('ptr-inner');
    if (inner) inner.style.opacity = Math.min(h / PTR_THRESHOLD, 1).toString();
  }

  function resetIndicator() {
    if (!indicator) return;
    indicator.style.height = '0';
    indicator.classList.remove('ptr-ready','ptr-loading');
    var inner = document.getElementById('ptr-inner');
    if (inner) inner.style.opacity = '0';
    currentPull = 0;
    triggered   = false;
  }

  // Init after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// "Mon Oct 12" → "Lunes 12 oct"
function _calDayEs(d) {
  var D = {Sun:'Domingo',Mon:'Lunes',Tue:'Martes',Wed:'Miércoles',Thu:'Jueves',Fri:'Viernes',Sat:'Sábado'};
  var M = {Jan:'ene',Feb:'feb',Mar:'mar',Apr:'abr',May:'may',Jun:'jun',Jul:'jul',Aug:'ago',Sep:'sept',Oct:'oct',Nov:'nov',Dec:'dic'};
  var p = String(d).replace(/,/g, ' ').trim().split(/\s+/);
  if (p.length === 3 && D[p[0]] && M[p[1]]) return D[p[0]] + ' ' + p[2] + ' ' + M[p[1]];
  return d;
}
// Bloque del día a la izquierda: "LUN / 12 / oct"
function _calDayTile(d, isToday) {
  var D = {Sun:'Dom',Mon:'Lun',Tue:'Mar',Wed:'Mié',Thu:'Jue',Fri:'Vie',Sat:'Sáb'};
  var M = {Jan:'ene',Feb:'feb',Mar:'mar',Apr:'abr',May:'may',Jun:'jun',Jul:'jul',Aug:'ago',Sep:'sept',Oct:'oct',Nov:'nov',Dec:'dic'};
  var p = String(d).replace(/,/g, ' ').trim().split(/\s+/);
  if (!(p.length === 3 && D[p[0]] && M[p[1]])) return '<div class="cal-day-tile"><span>' + d + '</span>' + (isToday ? '<i>Hoy</i>' : '') + '</div>';
  return '<div class="cal-day-tile"><span>' + D[p[0]] + '</span><b>' + p[2] + '</b><small>' + M[p[1]] + '</small>' + (isToday ? '<i>Hoy</i>' : '') + '</div>';
}

function _calTx(t) {
  return String(t).replace(/📈\s?/g, '<b class="cx up">▲</b> ').replace(/📉\s?/g, '<b class="cx dn">▼</b> ').replace(/➡️\s?/g, '');
}
// Trae el calendario; si el servidor falla reintenta una vez y, si sigue fallando,
// muestra la última copia buena guardada en este navegador (de los últimos 3 días)
function _calFetch() {
  var get = function() {
    return fetch('/api/calendar').then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        if (!d || !d.ok) throw new Error('feed');
        try { localStorage.setItem('mk-cal', JSON.stringify(d)); } catch (e) {}
        return d;
      });
  };
  return get()
    .catch(function() { return new Promise(function(ok){ setTimeout(ok, 3000); }).then(get); })
    .catch(function(err) {
      var sv = null;
      try { sv = JSON.parse(localStorage.getItem('mk-cal') || 'null'); } catch (e) {}
      if (sv && sv.events && sv.events.length && sv.updated && (Date.now() - new Date(sv.updated)) < 3 * 864e5) return sv;
      throw err;
    });
}

      });

      var html = '';
      order.forEach(function(date) {
        var isToday = date.indexOf(todayDow) === 0;
        html += '<div class="cal-day-group' + (isToday ? ' is-today' : '') + '">';
        html += _calDayTile(date, isToday) + '<div class="cal-day-list">';

        groups[date].forEach(function(ev, idx) {
          var curr     = ev.currency || '';
          var meta     = currMeta[curr] || { flag: '<img src="https://flagcdn.com/24x18/un.png" width="24" height="18" style="border-radius:2px;vertical-align:middle;" alt="">', color: 'var(--c-text2)' };
          var hasAct   = ev.actual && ev.actual !== '—';
          var isSoft   = !ev.time || ev.time === 'Todo el día' || ev.time === 'Tentativo';
          var expl     = getExplanation(ev.name);
          var uid      = 'cal-' + date.replace(/[^a-z0-9]/gi,'') + '-' + idx;

          // Better/worse
          var actualClass = 'cal-actual';
          // Apply manual override if exists
          if (window._calOverrides && window._calOverrides[ev.isoDate + '|' + ev.name]) {
            ev.actual = window._calOverrides[ev.isoDate + '|' + ev.name];
            hasAct = true;
          }

          if (hasAct && ev.forecast && ev.forecast !== '—') {
            var a = parseFloat(ev.actual), f = parseFloat(ev.forecast);
            if (!isNaN(a) && !isNaN(f)) actualClass += a >= f ? ' better' : ' worse';
          }

          html += '<div class="cal-event' + (hasAct ? ' cal-released' : '') + '" data-uid="' + uid + '" onclick="toggleCalExplain(this.dataset.uid)">';

          // Time
          html += '<div class="cal-time' + (isSoft ? ' cal-soft' : '') + '">' + ev.time + '</div>';

          // Flag only (no currency text)
          html += '<div class="cal-flag-wrap"><div class="cal-flag">' + meta.flag + '</div></div>';

          // Name + badge inline
          html += '<div><div class="cal-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' + ev.name + '<span class="cal-impact-badge"><i></i><span class="cal-impact-text">Alto impacto</span></span></div></div>';

          // Values — always show all 3 columns
          html += '<div class="cal-values">';
          // Real — always visible, shows "—" if not published yet
          html += '<div class="cal-val">';
          html += '<div class="cal-val-label">Real</div>';
          if (hasAct) {
            html += '<div class="cal-val-num ' + actualClass + '" data-cal-key="' + ev.isoDate + '|' + ev.name + '">' + ev.actual + '</div>';
          } else {
            html += '<div class="cal-val-num cal-pending" data-cal-key="' + ev.isoDate + '|' + ev.name + '">—</div>';
          }
          html += '</div>';
          // Forecast
          html += '<div class="cal-val"><div class="cal-val-label">Pronós</div><div class="cal-val-num">' + (ev.forecast !== '—' ? ev.forecast : '—') + '</div></div>';
          // Previous
          html += '<div class="cal-val"><div class="cal-val-label">Previo</div><div class="cal-val-num">' + (ev.previous !== '—' ? ev.previous : '—') + '</div></div>';
          // Admin edit button inside values row
          if (cProfile && cProfile.role === 'admin') {
            html += '<button onclick="event.stopPropagation();editCalReal(this.dataset.name,this.dataset.date,this.dataset.val)" ' +
              'data-name="' + ev.name.replace(/"/g,"'") + '" data-date="' + ev.isoDate + '" data-val="' + (ev.actual||'') + '" ' +
              'class="cal-edit" title="Editar dato real">' + MK_IC.edit + '</button>';
          }
          html += '</div>';

          // Explanation panel (hidden by default, shown on click)
          html += '<div class="cal-explain" id="' + uid + '">';
          html += '<div class="cal-explain-tit">¿Qué significa este dato?</div>';
          html += '<div class="cal-explain-row"><span class="cal-explain-icon up">▲</span><span><strong>Si sale mayor al pronóstico:</strong> ' + _calTx(expl.up) + '</span></div>';
          html += '<div class="cal-explain-row"><span class="cal-explain-icon dn">▼</span><span><strong>Si sale menor al pronóstico:</strong> ' + _calTx(expl.down) + '</span></div>';
          html += '<div class="cal-explain-row"><span class="cal-explain-icon eq">=</span><span><strong>Si sale igual al pronóstico:</strong> ' + _calTx(expl.neutral) + '</span></div>';
          html += '</div>';

          html += '</div>'; // .cal-event
        });
        html += '</div></div>'; // .cal-day-list .cal-day-group
      });

      html += '<div class="cal-foot">';
      html += '<div>Toca una noticia para ver su impacto en el mercado</div>';
      html += '<a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener" style="font-size:.63rem;color:var(--c-faint);text-decoration:none;display:inline-flex;align-items:center;gap:4px;">';
      html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
      html += 'ForexFactory</a></div>';

      c.innerHTML = html;
    })
    .catch(function(err) {
      if (c.querySelector('.cal-event')) return; // si ya se veía, lo dejamos como estaba
      c.innerHTML = '<div class="cal-error"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>No se pudo cargar el calendario. Intenta más tarde.</div>';
      console.error('Calendar error:', err);
    });
}

// ── AUTO SESSION ACTIVATOR ──
// Runs every 30 seconds — activates sessions when start time is reached,
// deactivates when end_time passes or manually toggled
function checkSessionTimes() {
  var now = new Date();
  sb.from('live_sessions').select('id, scheduled_at, end_time, is_active, manually_deactivated').then(function(r) {
    if (!r.data) return;
    r.data.forEach(function(s) {
      var start = new Date(s.scheduled_at);
      var end   = s.end_time ? new Date(s.end_time) : null;

      // Should be active: start <= now AND (no end OR now < end)
      var shouldBeActive = start <= now && (!end || now < end);
      // Should be inactive: end exists AND now >= end
      var shouldBeInactive = end && now >= end;

      if (shouldBeActive && !s.is_active && s.manually_deactivated !== true) {
        // Auto-activate only if not manually deactivated
        sb.from('live_sessions').update({ is_active: true }).eq('id', s.id).then(function() {
          var cur = history.state;
          if (cur && cur.section === 'sesiones') rSes();
        });
      } else if (shouldBeInactive && s.is_active) {
        // Auto-deactivate by end_time
        sb.from('live_sessions').update({ is_active: false, manually_deactivated: false }).eq('id', s.id).then(function() {
          var cur = history.state;
          if (cur && cur.section === 'sesiones') rSes();
        });
      }
    });
  });
}

// ── INACTIVITY + MEMBERSHIP CHECKER ──
var INACTIVITY_LIMIT = 2 * 60 * 60 * 1000; // 2 horas en ms
var _lastActivity = Date.now();

function _resetActivity() { _lastActivity = Date.now(); }

['mousemove','keydown','click','scroll','touchstart'].forEach(function(ev) {
  document.addEventListener(ev, _resetActivity, { passive: true });
});

function _checkInactivityAndMembership() {
  // 1. Inactividad
  if (Date.now() - _lastActivity > INACTIVITY_LIMIT) {
    sb.auth.signOut().then(function() {
      window.location.href = '/login';
    });
    return;
  }
  // 2. Membresía vencida — mostrar pantalla bloqueada sin cerrar sesión
  // (solo si NO tiene ningún acceso válido: ni Clases, ni Live, ni 1-a-1)
  if (cProfile && cProfile.role !== 'admin' && cProfile.role !== 'staff') {
    var end = cProfile.membership_end ? new Date(cProfile.membership_end) : null;
    var liveEnd = cProfile.live_end ? new Date(cProfile.live_end) : null;
    var hasClases = end && end > new Date();
    var hasLive = liveEnd && liveEnd > new Date();
    var has1on1 = !!cProfile.access_1on1;
    if (!hasClases && !hasLive && !has1on1) {
      var aside = document.querySelector('.aside');
      if (aside) aside.style.display = 'none';
      var mobNav = document.getElementById('mob-nav');
      if (mobNav) mobNav.style.display = 'none';
      document.querySelectorAll('.snav[data-v], .mob-nav-btn').forEach(function(b) {
        b.onclick = function(e) { e.stopPropagation(); e.preventDefault(); };
      });
      showPending();
    }
  }
}

// Start checker when user is logged in
function startSessionChecker() {
  checkSessionTimes(); // run immediately
  setInterval(checkSessionTimes, 30000); // live sessions every 30s
  setInterval(_checkInactivityAndMembership, 60000); // inactivity + membership every 60s
}

function editCalReal(name, isoDate, currentVal) {
  var existing = document.getElementById('cal-edit-modal');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'cal-edit-modal';
  _injectWhopStyles();
  overlay.className = 'wp-overlay';
  overlay.innerHTML =
    '<div class="wp-modal" style="max-width:380px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+MK_IC.edit+'</div>' +
        '<div><div class="wp-title" style="font-size:1rem;">Editar valor Real</div><div class="wp-subtitle">' + name + ' · ' + isoDate + '</div></div>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        '<div class="wp-field"><label class="wp-label">Valor Real</label>' +
        '<input id="cal-real-input" class="wp-input" value="' + (currentVal||'') + '" placeholder="Ej: 3.2%"></div>' +
        '<div class="wp-footer">' +
          '<button id="cal-real-save" class="wp-btn-primary">Guardar</button>' +
          '<button class="wp-btn-ghost" onclick="var m=document.getElementById(\'cal-edit-modal\');if(m)m.remove();">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });

  document.getElementById('cal-real-save').addEventListener('click', function() {
    var val = document.getElementById('cal-real-input').value.trim();
    this.disabled = true; this.textContent = 'Guardando...';
    sb.from('cal_overrides').upsert({
      event_name: name,
      event_date: isoDate,
      actual_value: val,
      updated_at: new Date().toISOString()
    }, { onConflict: 'event_name,event_date' }).then(function(r) {
      if (r.error) { tst('Error: ' + r.error.message, 1); return; }
      tst('✓ Valor actualizado');
      overlay.remove();
      // Clear calendar cache and reload
      window._calCache = null;
      loadCalendar();
    });
  });
}

function toggleCalExplain(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
}
