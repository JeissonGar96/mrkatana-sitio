function editRoadmapWeek(weekNum, existing) {
  var acts = existing && Array.isArray(existing.activities) ? existing.activities : (existing ? JSON.parse(existing.activities||'[]') : []);
  var ov = document.createElement('div');
  ov.id = 'roadmap-week-modal';
  _injectWhopStyles();
  ov.className = 'wp-overlay';
  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };
  var box = document.createElement('div');

  box.style.overflowY = 'auto';
  box.innerHTML =
    '<div class="wp-header" style="padding:20px 24px 4px;">' +
      '<div class="wp-title" style="flex:1;font-size:1.05rem;">Editar Semana '+weekNum+'</div>' +
      '<button onclick="this.closest(\'.wp-overlay\').remove()" style="background:none;border:none;color:var(--c-muted);font-size:1.3rem;cursor:pointer;">✕</button>' +

      '</div>' +
      '<div class="wp-footer" style="margin-top:6px;">' +
        '<button onclick="saveRoadmapWeek('+weekNum+')" class="wp-btn-primary">Guardar semana</button>' +
        (existing ? '<button onclick="deleteRoadmapWeek('+weekNum+')" class="wp-btn-danger">Eliminar</button>' : '') +
      '</div>' +
    '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
}

function saveRoadmapWeek(weekNum) {
  var title = document.getElementById('rw-title').value.trim();
  var obj = document.getElementById('rw-obj').value.trim();
  var actsRaw = document.getElementById('rw-acts').value.trim();
  var acts = actsRaw ? actsRaw.split('\n').map(function(a){return a.trim();}).filter(Boolean) : [];
  if (!title) return tst('El título es requerido', 1);
  sb.from('roadmap_weeks').upsert({
    week_number: weekNum, title: title, objective: obj, activities: JSON.stringify(acts)
  }, { onConflict: 'week_number' }).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Semana ' + weekNum + ' guardada');
    var ov = document.getElementById('roadmap-week-modal'); if (ov) ov.remove();
    rAdmRoadmap();
  });
}

function deleteRoadmapWeek(weekNum) {
  if (!confirm('¿Eliminar el contenido de la semana ' + weekNum + '?')) return;
  sb.from('roadmap_weeks').delete().eq('week_number', weekNum).then(function(r) {
    if (r.error) return tst('Error', 1);
    tst('✓ Semana eliminada');
    var ov = document.getElementById('roadmap-week-modal'); if (ov) ov.remove();
    rAdmRoadmap();
  });
}

    if (r.error) { el.innerHTML = '<div class="mk-empty">Error: ' + _mkEsc(r.error.message) + '</div>'; return; }
    _a1Data = r.data || [];
    // Marca automática: reuniones dentro de la app que ya pasaron y nadie revisó
    var auto = _a1Data.filter(function(m) {
      return _mtgDone(m) && (!m.status || m.status === 'scheduled') && ('student_joined_at' in m) && new Date(m.scheduled_at) >= (_mtgInApp(m) ? MTG_AUTO_FROM : MTG_AUTO_FROM_EXT);
    });
    auto.forEach(function(m) {
      m.status = m.student_joined_at ? 'completed' : 'no_show'; m._auto = true;
      sb.from('meetings_1on1').update({ status: m.status }).eq('id', m.id).then(function(){});
    });
    _rA1List();
  });
}

function _a1Av(name) {
  var ini = String(name || '?').split(' ').map(function(w){ return w[0] || ''; }).slice(0, 2).join('').toUpperCase();
  return '<span class="a1-av">' + _mkEsc(ini) + '</span>';
}
var _A1_ST = { completed: ['Completada', 'g'], no_show: ['No asistió', 'r'], cancelled: ['Cancelada', 'n'], scheduled: ['Sin revisar', 'w'] };

function _rA1List() {
  var el = document.getElementById('a1on1-list'); if (!el) return;
  var q = ((document.getElementById('a1-q') || {}).value || '').toLowerCase().trim();
  var up = [], past = [];
  _a1Data.forEach(function(m) { (_mtgDone(m) ? past : up).push(m); });
  up.reverse();
  var pend = past.filter(function(m){ return !m.status || m.status === 'scheduled'; }).length;
  var nu = document.getElementById('a1-n-up'); if (nu) nu.textContent = up.length || '';
  var np = document.getElementById('a1-n-past'); if (np) { np.textContent = pend || ''; np.className = pend ? 'warn' : ''; }
  // Los números cambian la altura de la pestaña: recolocar la línea para que no "salte" al tocar
  _tabInk(document.querySelector('.a1-tabs'));
  var rows = (_a1Tab === 'past' ? past : up).filter(function(m) {
    return !q || ((m.profiles && m.profiles.full_name) || '').toLowerCase().indexOf(q) > -1 || (m.title || '').toLowerCase().indexOf(q) > -1;
  });
  if (!rows.length) {
    el.innerHTML = '<div class="mk-card a1-empty">' + (q ? 'Sin resultados para "' + _mkEsc(q) + '".' : _a1Tab === 'past' ? 'Aún no hay reuniones pasadas.' : 'No hay reuniones próximas. Usa "+ Programar reunión" para agendar una.') + '</div>';
    return;
  }
  var isPast = _a1Tab === 'past';
  var total = rows.length;
  rows = rows.slice(0, _a1Shown);
  var ico = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  var del = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  var html = '<div class="mk-card mk-tbl-wrap"><table class="mk-tbl a1-tbl"><thead><tr><th>Alumno</th><th>Tema</th><th>Fecha</th><th>Llamada</th><th>' + (isPast ? 'Asistencia' : 'Empieza') + '</th>' + (isPast ? '<th>Estado</th>' : '') + '<th></th></tr></thead><tbody>';
  rows.forEach(function(m) {
    var d = new Date(m.scheduled_at), name = (m.profiles && m.profiles.full_name) || 'Alumno';
    if (m.fathom_summary) _mtgSum[m.id] = m;
    var inApp = _mtgInApp(m);
    var call = inApp ? '<span class="mk-pill">En la app</span>' : '<a class="mk-pill b a1-ext" href="' + _mkEsc(_mkSafeUrl(m.meet_url)) + '" target="_blank" rel="noopener">Link externo ↗</a>';
    var fecha = d.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    var col5, col6 = '', act;
    if (isPast) {
      if (m.student_joined_at) col5 = '<span class="a1-ok"><i></i>Entró ' + new Date(m.student_joined_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</span>';
      else col5 = '<span class="a1-mut"><i></i>No entró</span>';
      var st = _A1_ST[m.status] ? m.status : 'scheduled';
      col6 = '<td><select class="a1-st ' + _A1_ST[st][1] + '" data-id="' + _mkEsc(m.id) + '">' +
        ['scheduled', 'completed', 'no_show', 'cancelled'].map(function(k) { return '<option value="' + k + '"' + (k === st ? ' selected' : '') + '>' + _A1_ST[k][0] + '</option>'; }).join('') +
        '</select>' + (m._auto ? '<div class="a1-auto">marcada sola</div>' : '') + '</td>';
    } else {
      var df = d - new Date(), D = Math.floor(df / 86400000), H = Math.floor(df % 86400000 / 3600000), M = Math.max(0, Math.floor(df % 3600000 / 60000));
      col5 = df <= 0 ? '<span class="a1-ok"><i></i>Ahora</span>' : '<span class="' + (df < 3600000 ? 'a1-soon' : 'a1-mut') + '">en ' + (D > 0 ? D + 'd ' + H + 'h' : H > 0 ? H + 'h ' + M + 'm' : M + ' min') + '</span>';
    }
    act = '<div class="a1-act">' +
      (!isPast ? (inApp ? '<button class="mk-chip" data-a1join="' + _mkEsc(m.id) + '" data-t="' + _mkEsc(m.title || 'Sesión 1-1') + '" data-n="' + _mkEsc(name) + '">Entrar</button>' : '') : '') +
      (m.fathom_summary ? '<button class="mk-chip sum-chip" onclick="openMtgSummary(\'' + _mkEsc(m.id) + '\')">Resumen</button>' : '') +
      '<button class="a1-ic" title="Editar" onclick="openEditMtgModal(\'' + m.id + '\',\'' + encodeURIComponent(m.title || 'Sesión 1-1') + '\',\'' + encodeURIComponent(m.meet_url || '') + '\',\'' + m.scheduled_at + '\')">' + ico + '</button>' +
      '<button class="a1-ic del" title="Eliminar" onclick="delAdmMtg(\'' + m.id + '\')">' + del + '</button></div>';
    html += '<tr><td><div class="a1-who">' + _a1Av(name) + '<b>' + _mkEsc(name) + '</b></div></td><td class="a1-t">' + _mkEsc(m.title || 'Sesión 1-1') + '</td><td class="a1-d">' + fecha + '</td><td>' + call + '</td><td>' + col5 + '</td>' + col6 + '<td>' + act + '</td></tr>';
  });
  html += '</tbody></table></div>';
  if (total > rows.length) html += '<div class="a1-more"><button class="mk-btn ghost" id="a1-more">Ver ' + Math.min(5, total - rows.length) + ' más</button><span>Mostrando ' + rows.length + ' de ' + total + '</span></div>';
  if (isPast) html += '<div class="a1-note">Las reuniones se marcan solas: Completada si el alumno entró (o tocó "Entrar" en el link externo) y No asistió si no entró. Puedes cambiar el estado cuando quieras.</div>';
  el.innerHTML = html;
  var mb = document.getElementById('a1-more');
  if (mb) mb.addEventListener('click', function() { _a1Shown += 5; _rA1List(); });
  el.querySelectorAll('.a1-st').forEach(function(s) {
    s.addEventListener('change', function() { setMtgStatus(s.dataset.id, s.value); });
  });
  el.querySelectorAll('[data-a1join]').forEach(function(b) {
    b.addEventListener('click', function() { _lvJoinRoom(b.dataset.a1join, b.dataset.t + ' · ' + b.dataset.n, { meeting: true }); });
  });
}

function setMtgStatus(id, st) {
  sb.from('meetings_1on1').update({ status: st }).eq('id', id).then(function(r) {
    if (r.error) { tst('No se pudo guardar el estado: ' + r.error.message, 1); return _rAdm1on1Load(); }
    var m = _a1Data.find(function(x){ return String(x.id) === String(id); }); if (m) { m.status = st; m._auto = false; }
    tst('✓ Estado guardado');
    _rA1List();
  });
}

function _renderSchModalList(students) {
  var listEl = document.getElementById('sch-modal-list'); if (!listEl) return;

    var initials = (s.full_name||'?').split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();
    var active = s.membership_end && new Date(s.membership_end) > new Date();
    return '<div onclick="schSelectStudent(\'' + s.id + '\',\'' + encodeURIComponent(s.full_name||'Alumno') + '\',' + active + ')" ' +

      'onmouseover="this.style.background=\'rgba(var(--c-acc),.08)\';this.style.borderColor=\'rgba(var(--c-acc),.2)\'" ' +
      'onmouseout="this.style.background=\'transparent\';this.style.borderColor=\'transparent\'">' +
      '<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--st),var(--sl));display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff;flex-shrink:0;">' + initials + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:.85rem;font-weight:600;color:var(--c-text);">' + _mkEsc(s.full_name||'Sin nombre') + '</div>' +
        '<div style="font-size:.68rem;margin-top:1px;color:' + (active?'rgb(var(--c-ok))':'var(--c-muted)') + ';">' + (active?'● Activo':'○ Inactivo') + '</div>' +
      '</div>' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>' +
    '</div>';
  }).join('');
}

function filterSchModal(q) {
  var term = (q||'').toLowerCase().trim();
  var all = window._schModalStudents || [];
  _renderSchModalList(term ? all.filter(function(s){ return (s.full_name||'').toLowerCase().indexOf(term) !== -1; }) : all);
}

function schSelectStudent(id, encName, active) {
  window._schSelectedId = id;
  var name = decodeURIComponent(encName);
  var initials = name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();

  var sel = document.getElementById('sch-selected-student');
  if (sel) sel.innerHTML =
    '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--st),var(--sl));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;">' + initials + '</div>' +

function schBack() {
  document.getElementById('sch-step2').style.display = 'none';
  document.getElementById('sch-step1').style.display = 'flex';
  var sub = document.getElementById('sch-modal-subtitle');
  if (sub) sub.textContent = 'Selecciona un alumno';
}

function saveSchModal() {
  var studentId = window._schSelectedId;
  if (!studentId) return tst('Selecciona un alumno', 1);
  var title = (document.getElementById('sch-m-title')||{}).value || 'Sesión 1-1';
  var date  = (document.getElementById('sch-m-date') ||{}).value || '';
  var time  = (document.getElementById('sch-m-time') ||{}).value || '00:00';
  var url   = _mtgWhereUrl('sch-m-url');
  if (!date) return tst('Selecciona una fecha', 1);
  var btn = document.getElementById('sch-m-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  sb.from('meetings_1on1').insert({
    student_id:   studentId,
    scheduled_at: new Date(date + 'T' + time).toISOString(),
    title:        title.trim() || 'Sesión 1-1',
    meet_url:     url.trim() || null,
    status:       'scheduled'
  }).then(function(r) {
    if (r.error) { tst('Error: '+r.error.message,1); if(btn){btn.disabled=false;btn.textContent='Programar sesión';} return; }
    tst('✓ Sesión programada');
    var m = document.getElementById('sch-modal');
    if (m) m.remove();
    // Refresh meetings tab if visible
    _rAdm1on1Refresh();
  });
}

// Campo "Dónde": llamada dentro de la app (sala privada) o link externo
function _mtgWhereHtml(pre, url) {
  var ext = !!url;
  return '<div class="wp-field"><label class="wp-label">Dónde será la llamada</label><div class="lv-seg mtg-where">' +
      '<button type="button" data-w="app"' + (ext ? '' : ' class="on"') + '>En la app</button>' +
      '<button type="button" data-w="ext"' + (ext ? ' class="on"' : '') + '>Link externo</button></div>' +
    '<div class="mtg-where-hint" style="font-size:.74rem;color:var(--c-muted);margin-top:8px;' + (ext ? 'display:none;' : '') + '">Sala privada: solo entran tú y este alumno, desde su pestaña Reuniones 1-1.</div>' +
    '<input id="' + pre + '-url" class="wp-input" style="margin-top:10px;' + (ext ? '' : 'display:none;') + '" value="' + _mkEsc(url || '') + '" placeholder="https://meet.google.com/...">' +
  '</div>';
}
function _mtgWhereBind(ov) {
  var seg = ov.querySelector('.mtg-where'); if (!seg) return;
  seg.querySelectorAll('button').forEach(function(b) {
    b.addEventListener('click', function() {
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
      var ext = b.dataset.w === 'ext', f = seg.parentNode;
      f.querySelector('.mtg-where-hint').style.display = ext ? 'none' : '';
      var inp = f.querySelector('input'); inp.style.display = ext ? '' : 'none'; if (ext) inp.focus();
    });
  });
}
function _mtgWhereUrl(id) {
  var inp = document.getElementById(id); if (!inp) return '';
  var on = inp.parentNode.querySelector('.mtg-where .on');
  return on && on.dataset.w === 'ext' ? inp.value.trim() : '';
}

function _rAdm1on1Rec() {
  var el = document.getElementById('a1on1-rec'); if (!el) return;
  el.innerHTML = '<div style="padding:20px 0;text-align:center;"><span class="spin"></span></div>';

  // Load all students + their recordings
  Promise.all([
    _fetchAllStudents(),
    sb.from('recordings_1on1').select('id, student_id, title, video_url, description, recorded_at').order('recorded_at', { ascending: false }).then(function(r){ return r.data || []; })
  ]).then(function(res) {
    var students   = res[0] || [];
    var recordings = res[1] || [];

    // Index recordings by student
    var byStudent = {};
    recordings.forEach(function(r) {
      if (!byStudent[r.student_id]) byStudent[r.student_id] = [];
      byStudent[r.student_id].push(r);
    });

    // Buscador + lista de alumnos
    var html = '<div style="margin-bottom:14px;position:relative;">' +
      '<input id="rec-stu-search" class="ai" placeholder="Buscar alumno..." oninput="filterRecStudents(this.value)" style="width:100%;box-sizing:border-box;padding-left:12px;">' +
    '</div>' +
    '<div id="rec-stu-list">';

    students.forEach(function(s) {
      var recs = byStudent[s.id] || [];
      var initials = (s.full_name||'?').split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();

function filterRecStudents(q) {
  var term = (q||'').toLowerCase().trim();
  var cards = document.querySelectorAll('.rec-stu-card');
  var any = false;
  cards.forEach(function(card) {
    var name = card.getAttribute('data-name') || '';
    var show = !term || name.indexOf(term) !== -1;
    card.style.display = show ? 'block' : 'none';
    if (show) any = true;
  });
  // Show/hide empty state
  var empty = document.getElementById('rec-stu-empty');
  if (!empty && !any) {
    var list = document.getElementById('rec-stu-list');
    if (list) {
      var d = document.createElement('div');
      d.id = 'rec-stu-empty';
      d.style.cssText = 'text-align:center;padding:20px;font-size:.8rem;color:var(--c-faint);';
      d.textContent = 'Sin resultados para "' + q + '"';
      list.appendChild(d);
    }
  } else if (empty && any) {
    empty.remove();
  } else if (empty && !any) {
    empty.textContent = 'Sin resultados para "' + q + '"';
  }
}

// Modal compartido: elige un plan/variante REAL (filtrado por categoría) y aplica
// exactamente su duración a Clases o a Live, según cuál toggle lo abrió.
function openAccessPickerModal(studentId, kind) {
  var isLive = kind === 'live';
  var existing = document.getElementById('access-picker-modal');
  if (existing) existing.remove();
  _injectWhopStyles();

  var opts = [];
  (window._allPlans || []).filter(function(p){ return p.active; }).forEach(function(p) {
    var relevant = isLive ? (p.category === 'live' || p.category === 'ambos') : (p.category === 'clases' || p.category === 'ambos');
    if (!relevant) return;
    if (p.variants && p.variants.length) {
      p.variants.forEach(function(v) {
        var dur = isLive ? v.duration_live_months : v.duration_clases_months;
        opts.push({ value: p.id + '|' + v.id, label: p.name + ' — ' + v.name, dur: dur });
      });
    } else {
      var dur = isLive ? p.duration_live_months : p.duration_clases_months;
      opts.push({ value: p.id + '|', label: p.name, dur: dur });
    }
  });

  var modal = document.createElement('div');
  modal.id = 'access-picker-modal';
  modal.className = 'wp-overlay';
  modal.style.zIndex = '10000';
  modal.innerHTML =
    '<div class="wp-modal" style="max-width:400px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+(isLive?MK_IC.live:MK_IC.book)+'</div>' +
        '<div class="wp-title" style="font-size:1rem;">Activar '+(isLive?'Live':'Clases')+'</div>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        (opts.length ?
          '<div class="wp-field"><label class="wp-label">Plan a asignar</label><select id="ap-sel" class="wp-input">' +
            opts.map(function(o){ return '<option value="'+o.value+'">'+o.label+(o.dur?' ('+o.dur+' meses)':' (ilimitado)')+'</option>'; }).join('') +
          '</select></div>'
        : '<div style="font-size:.8rem;color:var(--c-muted);">No hay planes activos de categoría "'+(isLive?'Live':'Clases')+'" — créalos primero en Gestión de Planes.</div>'
        ) +
        '<div class="wp-footer">' +
          (opts.length ? '<button id="ap-btn" class="wp-btn-primary">Activar</button>' : '') +
          '<button class="wp-btn-ghost" onclick="document.getElementById(\'access-picker-modal\').remove();var cb=document.getElementById(\''+(isLive?'stud-live-toggle':'stud-clases-toggle')+'\');if(cb)cb.checked=false;">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){
    if (e.target === modal) {
      modal.remove();
      var cb = document.getElementById(isLive ? 'stud-live-toggle' : 'stud-clases-toggle');
      if (cb) cb.checked = false;
    }
  });

  if (!opts.length) return;

  document.getElementById('ap-btn').addEventListener('click', function() {
    var val = document.getElementById('ap-sel').value.split('|');
    var planId = val[0];
    var variantId = val[1] || null;
    var chosen = opts.find(function(o){ return o.value === planId + '|' + (variantId||''); });
    var dur = chosen ? chosen.dur : null;
    var btn = this; btn.disabled = true; btn.textContent = 'Activando...';

    var upd = {};
    if (isLive) {
      upd.live_plan = planId;
      upd.live_end = dur ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+dur); return e.toISOString(); })() : UNLIMITED_ISO;
    } else {
      upd.plan = planId;
      upd.membership_start = new Date().toISOString();
      upd.membership_end = dur ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+dur); return e.toISOString(); })() : UNLIMITED_ISO;
      var planDef = _planById(planId);
      if (planDef) { upd.access_1on1 = !!planDef.access_1on1; upd.roadmap_mode = planDef.roadmap_mode; }
    }
    _updateStudent(studentId, upd).then(function(r) {
      modal.remove();
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('✓ ' + (isLive?'Live':'Clases') + ' activado');
      viewStudentProfile(studentId);
    });
  });
}

function loadStudentRoadmap(studentId, roadmapMode, membershipStart) {
  var container = document.getElementById('stud-roadmap-' + studentId);
  if (!container) return;

  var isMentoria = roadmapMode === 'manual';

  // Load roadmap weeks and progress together
  Promise.all([
    sb.from('roadmap_weeks').select('week_number, title').order('week_number'),
    sb.from('roadmap_progress').select('week_number, completed').eq('user_id', studentId)
  ]).then(function(results) {
    var weeks = results[0].data || [];
    var progress = results[1].data || [];
    var completedWeeks = {};
    progress.forEach(function(r) { if (r.completed) completedWeeks[r.week_number] = true; });

    // Calculate current week by time (for formacion-basico)
    var start = membershipStart ? new Date(membershipStart) : null;
    var timeWeek = start ? Math.max(1, Math.ceil((new Date() - start) / (7*86400000))) : 1;

    // For mentoria: current week = last completed week + 1
    var lastCompleted = 0;
    weeks.forEach(function(w) { if (completedWeeks[w.week_number]) lastCompleted = w.week_number; });
    var currentWeek = isMentoria ? (lastCompleted + 1) : timeWeek;

    var html = '<div style="font-size:.7rem;margin-bottom:10px;">' + (isMentoria ? '<span style="color:rgb(var(--c-acc));">● Avance manual</span>' : '<span style="color:var(--sl);">● Automático</span>') + '</div>';

    html += '<div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;">';
    weeks.forEach(function(w) {
      var isCompleted = completedWeeks[w.week_number];
      var isCurrent = w.week_number === currentWeek;
      var isLocked = w.week_number > currentWeek;

      html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:' +
        (isCompleted ? 'rgba(var(--c-ok),.06)' : isCurrent ? 'rgba(var(--c-acc),.1)' : 'rgba(var(--c-ov),.02)') +
        ';border:1px solid ' +
        (isCompleted ? 'rgba(var(--c-ok),.2)' : isCurrent ? 'rgba(var(--c-acc),.25)' : 'rgba(var(--c-ov),.04)') + ';">';

      if (isMentoria) {
        // Checkbox for mentoria
        html += '<input type="checkbox" ' + (isCompleted ? 'checked' : '') +
          ' onchange="toggleWeekComplete(\'' + studentId + '\',' + w.week_number + ',this.checked)" ' +
          'style="width:15px;height:15px;accent-color:rgb(var(--c-ok));cursor:pointer;flex-shrink:0;">';
      } else {
        // Status dot for formacion
        html += '<div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' +
          (isCompleted ? 'rgb(var(--c-ok))' : isCurrent ? 'var(--sl)' : 'rgba(var(--c-ov),.1)') + ';"></div>';
      }

      html += '<div style="flex:1;min-width:0;">' +
        '<span style="font-size:.72rem;font-weight:600;color:' +
        (isCompleted ? 'rgb(var(--c-ok))' : isCurrent ? 'var(--c-text)' : 'var(--c-muted)') + ';">Sem ' + w.week_number + '</span>' +
        '<span style="font-size:.7rem;color:var(--c-muted);margin-left:6px;">' + (w.title || '') + '</span>' +
        '</div>';

      if (isCurrent && !isCompleted) {
        html += '<span style="font-size:.6rem;color:rgb(var(--c-acc));font-weight:600;">▶ AQUÍ</span>';
      }

      html += '</div>';
    });
    html += '</div>';

    container.innerHTML = html;
  });
}

function toggleWeekComplete(studentId, weekNum, completed) {
  sb.from('roadmap_progress').upsert({

}

  if (existing) existing.remove();
  var name = decodeURIComponent(studentName);

  var ov = document.createElement('div');
  ov.id = 'recording-modal';
  _injectWhopStyles();
  ov.className = 'wp-overlay';
  ov.innerHTML =
    '<div class="wp-modal" style="max-width:440px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+MK_IC.video+'</div>' +
        '<div style="flex:1;"><div class="wp-title" style="font-size:1rem;">Subir grabación</div><div class="wp-subtitle">' + _mkEsc(name) + '</div></div>' +
        '<button onclick="document.getElementById(\'recording-modal\').remove()" style="background:none;border:none;color:var(--c-muted);font-size:1.2rem;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        '<div class="wp-field"><label class="wp-label">Título</label><input id="rec-title" class="wp-input" placeholder="Análisis de cuenta · Semana 3"></div>' +
        '<div class="wp-field"><label class="wp-label">URL Video (Bunny)</label><input id="rec-url" class="wp-input" placeholder="https://player.mediadelivery.net/embed/..."></div>' +
        '<div class="wp-field"><label class="wp-label">Descripción (opcional)</label><input id="rec-desc" class="wp-input" placeholder="Notas de la sesión"></div>' +
        '<div class="wp-field">' +
          '<label class="wp-label">Fecha</label>' +
          '<div style="display:flex;gap:6px;">' +
            (function(){
              var d='<select id="rec-date-d" class="wp-input" style="flex:1;min-width:0;"><option value="">Día</option>';
              for(var i=1;i<=31;i++) d+='<option value="'+String(i).padStart(2,'0')+'">'+i+'</option>';
              return d+'</select>';
            })() +
            (function(){
              var ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
              var s='<select id="rec-date-m" class="wp-input" style="flex:1;min-width:0;"><option value="">Mes</option>';
              ms.forEach(function(m,i){ s+='<option value="'+String(i+1).padStart(2,'0')+'">'+m+'</option>'; });
              return s+'</select>';
            })() +
            (function(){
              var y=new Date().getFullYear(), s='<select id="rec-date-y" class="wp-input" style="flex:1.4;min-width:0;"><option value="">Año</option>';
              for(var i=y;i>=y-10;i--) s+='<option value="'+i+'">'+i+'</option>';
              return s+'</select>';
            })() +
          '</div>' +
        '</div>' +
        '<button id="rec-save-btn" onclick="saveRecording(\''+studentId+'\')" class="wp-btn-primary" style="width:100%;">Guardar grabación</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
}

function saveRecording(studentId) {
  var title = (document.getElementById('rec-title')||{}).value || '';
  var url   = (document.getElementById('rec-url')  ||{}).value || '';
  var desc  = (document.getElementById('rec-desc')  ||{}).value || '';
  var rd    = (document.getElementById('rec-date-d') ||{}).value || '';
  var rm    = (document.getElementById('rec-date-m') ||{}).value || '';
  var ry    = (document.getElementById('rec-date-y') ||{}).value || '';
  var date  = (rd && rm && ry) ? ry+'-'+rm+'-'+rd : '';
  if (!title.trim()) return tst('El título es requerido', 1);
  if (!url.trim())   return tst('El link del video es requerido', 1);
  var btn = document.getElementById('rec-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  sb.from('recordings_1on1').insert({
    student_id:  studentId,
    title:       title.trim(),
    video_url:   url.trim(),
    description: desc.trim() || null,
    recorded_at: date ? new Date(date).toISOString() : new Date().toISOString()
  }).then(function(r) {
    if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar grabación';} return; }
    tst('✓ Grabación guardada');
    var m = document.getElementById('recording-modal');
    if (m) m.remove();
  });
}




function dStudent(id, confirmed) {
  if (!confirmed && !confirm('¿Eliminar este alumno permanentemente?\n\nSe borrará su cuenta, sus compras y su progreso. Si vuelve a registrarse empezará desde cero.')) return;
  _deleteStudent(id).then(function(r) {
    if (r.error) return tst(r.error.message === 'cannot_delete_admin' ? 'No se puede eliminar a un administrador' : 'Error: ' + r.error.message, 1);
    tst('✓ Alumno eliminado por completo');
    rAdmSt();
  });
}
function activateMember(id, isActive) {
  if (isActive) {
    if (!confirm('¿Desactivar membresía de este alumno?')) return;
    sb.from('profiles').update({ membership_end: new Date(Date.now() - 1000).toISOString() }).eq('id', id).then(function(r) {
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('Membresía desactivada');
      rAdmSt();
    });
    return;
  }

  // Mostrar modal para elegir plan
  if (!window._allPlans) { _loadPlansCache(function(){ activateMember(id, isActive); }); return; }
  var existing = document.getElementById('activate-modal');
  if (existing) existing.remove();

  var opts = [];
  (window._allPlans || []).filter(function(p){ return p.active; }).forEach(function(p) {
    if (p.variants && p.variants.length) {
      p.variants.forEach(function(v) {
        opts.push({
          value: p.id + '|' + v.id,
          label: (p.label || p.name) + ' — ' + v.name + ' ($' + Number(v.price).toLocaleString() + ')'
        });
      });
    } else {
      opts.push({ value: p.id + '|', label: p.name + ' ($' + Number(p.price).toLocaleString() + ')' });
    }
  });
  if (!opts.length) opts.push({ value: '|', label: 'Sin planes configurados — ve a Gestión de Planes' });

  var modal = document.createElement('div');
  modal.id = 'activate-modal';
  _injectWhopStyles();
  modal.className = 'wp-overlay';
  modal.innerHTML =
    '<div class="wp-modal" style="max-width:420px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+MK_IC.ticket+'</div>' +
        '<div><div class="wp-title" style="font-size:1rem;">Activar / Cambiar plan</div><div class="wp-subtitle">Asignación manual</div></div>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        '<div class="wp-field"><label class="wp-label">Plan</label><select id="act-plan-sel" class="wp-input">' +
          opts.map(function(o){ return '<option value="'+o.value+'">'+o.label+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="wp-toggle-row">' +
          '<span class="wp-toggle-text">Mantener fechas actuales</span>' +
          '<label class="wp-toggle"><input type="checkbox" id="act-keep-dates" onchange="document.getElementById(\'act-manual-date-wrap\').style.display=this.checked?\'none\':\'\';"><span class="wp-toggle-track"></span></label>' +
        '</div>' +
        '<div id="act-manual-date-wrap" class="wp-field">' +
          '<label class="wp-label">Fecha de vencimiento manual (opcional — anula la duración del plan)</label>' +
          '<input type="date" id="act-manual-date" class="wp-input">' +
        '</div>' +
        '<div class="wp-footer">' +
          '<button id="act-plan-btn" class="wp-btn-primary">Aplicar</button>' +
          '<button class="wp-btn-ghost" onclick="document.getElementById(\'activate-modal\').remove();">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });

  document.getElementById('act-plan-btn').addEventListener('click', function() {
    var val = document.getElementById('act-plan-sel').value.split('|');
    var planId = val[0];
    var variantId = val[1] || null;
    var planDef = _planById(planId);
    var variantDef = (variantId && planDef && planDef.variants) ? planDef.variants.find(function(v){ return v.id === variantId; }) : null;
    var keepDates = document.getElementById('act-keep-dates').checked;
    var manualDate = document.getElementById('act-manual-date').value;
    var btn = this;
    btn.disabled = true; btn.textContent = 'Aplicando...';

    var updateData = {
      plan: planId,
      access_1on1: planDef ? !!planDef.access_1on1 : false,
      roadmap_mode: planDef ? planDef.roadmap_mode : null
    };
    if (!keepDates) {
      var accessClases = variantDef && variantDef.access_clases !== null ? variantDef.access_clases : (planDef ? planDef.access_clases !== false : true);
      var durClases = variantDef ? variantDef.duration_clases_months : (planDef ? planDef.duration_clases_months : null);
      var durLive = variantDef ? variantDef.duration_live_months : (planDef ? planDef.duration_live_months : null);
      var now = new Date();

      if (manualDate) {
        updateData.membership_start = now.toISOString();
        updateData.membership_end = new Date(manualDate + 'T23:59:59').toISOString();
      } else if (!accessClases) {
        updateData.membership_start = null;
        updateData.membership_end = null;
      } else {
        updateData.membership_start = now.toISOString();
        updateData.membership_end = durClases ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+durClases); return e.toISOString(); })() : UNLIMITED_ISO;
      }
      if (durLive) {
        var liveEnd = new Date(); liveEnd.setMonth(liveEnd.getMonth() + durLive);
        updateData.live_plan = planId; updateData.live_end = liveEnd.toISOString();
      }
    }
    sb.from('profiles').update(updateData).eq('id', id).then(function(r) {
      modal.remove();
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('✓ Plan actualizado');
      rAdmSt();
    });
  });
}
function cSt() {
  var n=document.getElementById('a-n').value.trim(),e=document.getElementById('a-e').value.trim(),p=document.getElementById('a-p').value;
  if(!n||!e||!p) return tst('Completa todos los campos',1);
  sb.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:window.location.origin+'/app'}}).then(function(r){ if(r.error) return tst('Error: '+r.error.message,1); tst('✓ Alumno creado'); document.getElementById('a-n').value='';document.getElementById('a-e').value='';document.getElementById('a-p').value=''; setTimeout(rAdmSt,900); });
}

// ── UNIFIED EDIT MODAL ──
function openEditModal(type, data, parentLvId, parentModId) {
  var existing = document.getElementById('edit-modal');
  if (existing) existing.remove();

  var isNew = !data;
  var title = isNew
    ? (type==='level' ? '+ Nuevo nivel' : type==='module' ? '+ Nuevo módulo' : '+ Nueva clase')
    : (type==='level' ? '✎ Editar nivel' : type==='module' ? '✎ Editar módulo' : '✎ Editar clase');

  var modal = document.createElement('div');
  modal.id = 'edit-modal';
  _injectWhopStyles();
  modal.className = 'wp-overlay';
  modal.style.overflowY = 'auto';

  var box = document.createElement('div');
  box.className = 'wp-modal';
  box.style.maxWidth = '540px';
  box.style.padding = '4px';

  var html = '<div class="wp-header" style="padding:22px 24px 4px;">' +
    '<div class="wp-title" style="flex:1;font-size:1.05rem;">'+title+'</div>' +
    '<button onclick="closeEditModal()" style="background:none;border:none;color:var(--c-muted);font-size:1.2rem;cursor:pointer;padding:0 4px;">✕</button>' +
    '</div><div class="wp-body" style="padding:12px 24px 26px;">';

  if (type === 'level') {

function previewEmImg(input) {
  var file = input.files[0]; if (!file) return;
  document.getElementById('em-img-name').textContent = file.name;
  var prev = document.getElementById('em-img-prev');
  var wrap = document.getElementById('em-img-preview');
  if (prev) { prev.src = URL.createObjectURL(file); wrap.style.display = 'block'; }
}

function closeEditModal() {
  var m = document.getElementById('edit-modal'); if (m) m.remove();
}

async function saveEditModal(type, data, parentLvId, parentModId) {
  var btn = document.getElementById('em-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }

  var title = (document.getElementById('em-title')||{}).value || '';
  if (!title.trim()) { tst('El título es requerido', 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }

  if (type === 'level') {
    var thumbnailUrl = data ? (data.thumbnail_url || '') : '';
    var fileInput = document.getElementById('em-img-file');
    var file = fileInput && fileInput.files[0];
    if (file) {
      tst('Subiendo imagen...');
      var ext = file.name.split('.').pop();
      var path = 'levels/' + (data ? data.id : Date.now()) + '_' + Date.now() + '.' + ext;
      var up = await sb.storage.from('course-images').upload(path, file, { upsert: true });
      if (up.error) { tst('Error imagen: ' + up.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      thumbnailUrl = sb.storage.from('course-images').getPublicUrl(path).data.publicUrl;
    }
    var payload = {
      title: title.trim(),
      description: (document.getElementById('em-desc')||{}).value || '',
      thumbnail_url: thumbnailUrl,
      sort_order: parseInt((document.getElementById('em-ord')||{}).value) || 1,
      is_published: (document.getElementById('em-pub')||{}).checked !== false,
      is_controlled: (document.getElementById('em-controlled')||{}).checked || false,
    };
    var q = data ? sb.from('course_levels').update(payload).eq('id', data.id) : sb.from('course_levels').insert(payload);
    q.then(function(r) {
      if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      tst(data ? '✓ Nivel actualizado' : '✓ Nivel creado');
      closeEditModal(); _afterCourseEdit();
    });

  } else if (type === 'module') {
    var lvId = data ? data.level_id : parentLvId;
    if (!lvId) { tst('Sin nivel asignado', 1); return; }
    var unlockWeekVal = (document.getElementById('em-unlock')||{}).value;
    var payload2 = {
      title: title.trim(),
      description: (document.getElementById('em-desc')||{}).value || '',
      sort_order: parseInt((document.getElementById('em-ord')||{}).value) || 1,
      level_id: lvId,
      unlock_week: unlockWeekVal ? parseInt(unlockWeekVal) : null,
    };
    var q2 = data ? sb.from('course_modules').update(payload2).eq('id', data.id) : sb.from('course_modules').insert(payload2);
    q2.then(function(r) {
      if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      tst(data ? '✓ Módulo actualizado' : '✓ Módulo creado');
      closeEditModal(); _afterCourseEdit();
    });

  } else if (type === 'lesson') {
    var modId = (data && data.module_id) ? data.module_id : parentModId;
    if (!modId) { tst('Sin módulo asignado', 1); return; }

    // Handle thumbnail upload/delete for lesson
    var lesThumbUrl = data ? (data.thumbnail_url || '') : '';
    var lesThumbDel = (document.getElementById('em-thumb-del')||{}).checked;
    if (lesThumbDel) {
      // Also delete from storage
      if (data && data.thumbnail_url) {
        var oldPath = data.thumbnail_url.split('/course-images/')[1];
        if (oldPath) sb.storage.from('course-images').remove([oldPath]);
      }
      lesThumbUrl = null;
    } else {
      var lesThumbFile = document.getElementById('em-thumb-file');
      var lesThumbFileObj = lesThumbFile && lesThumbFile.files && lesThumbFile.files[0];
      if (lesThumbFileObj) {
        tst('Subiendo miniatura...');
        var lesExt = lesThumbFileObj.name.split('.').pop();
        var lesPath = 'lessons/' + (data ? data.id : Date.now()) + '_' + Date.now() + '.' + lesExt;
        var lesUp = await sb.storage.from('course-images').upload(lesPath, lesThumbFileObj, { upsert: true });
        if (lesUp.error) { tst('Error miniatura: ' + lesUp.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
        lesThumbUrl = sb.storage.from('course-images').getPublicUrl(lesPath).data.publicUrl;
      }
    }

    var hasTask = (document.getElementById('em-task')||{}).checked;
    var payload3 = {
      title: title.trim(),
      thumbnail_url: lesThumbUrl || null,
      video_url: (document.getElementById('em-url')||{}).value.trim() || '',
      description: (document.getElementById('em-desc')||{}).value || '',
      duration_minutes: parseInt((document.getElementById('em-min')||{}).value) || null,
      sort_order: parseInt((document.getElementById('em-ord')||{}).value) || 1,
      is_published: (document.getElementById('em-pub')||{}).checked !== false,
      has_task: hasTask,
      task_instructions: hasTask ? ((document.getElementById('em-task-ins')||{}).value || '') : null,
      module_id: modId,
    };
    var q3 = data ? sb.from('course_lessons').update(payload3).eq('id', data.id) : sb.from('course_lessons').insert(payload3);
    q3.then(function(r) {
      if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      tst(data ? '✓ Clase actualizada' : '✓ Clase creada');
      closeEditModal(); _afterCourseEdit();
    });
  }
}

// Legacy helpers kept for compatibility

// Tras crear/editar/borrar: refresca Admin y, si está abierta, la pestaña Curso
function _afterCourseEdit() {
  loadAdmLevels();
  if (document.getElementById('lvl-grid')) { showLevels(); return; }
  var c = window._lpCtx;
  if (document.getElementById('lesson-layout') && c && c.level) {
    window._lpKeep = courseState.lessonId;
    sb.from('course_levels').select('*').eq('id', c.level.id).single().then(function(r) {
      if (!r.data) { showLevels(); return; }
      showLessons({ id: courseState.moduleId }, r.data, {});
    });
  }
}

function dLevel(id) {
  if (!confirm('¿Eliminar nivel y todo su contenido?')) return;
  sb.from('course_levels').delete().eq('id', id).then(function() { tst('Eliminado'); _afterCourseEdit(); });
}
function dModule(id) {
  if (!confirm('¿Eliminar módulo y sus clases?')) return;
  sb.from('course_modules').delete().eq('id', id).then(function() { tst('Módulo eliminado'); _afterCourseEdit(); });
}
function dLesson(id) {
  if (!confirm('¿Eliminar esta clase?')) return;
  sb.from('course_lessons').delete().eq('id', id).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Clase eliminada'); _afterCourseEdit();
  });
}

// Línea dorada que se desliza bajo la pestaña activa (pestañas estilo Planes)
function _tabInk(wrap) {
  if (!wrap) return;
  var ink = wrap.querySelector('.wp-ink'), fresh = !ink;
  if (fresh) { ink = document.createElement('span'); ink.className = 'wp-ink'; wrap.appendChild(ink); wrap.classList.add('has-ink'); }
  var a = wrap.querySelector('.wp-subtab-btn.active');
  if (fresh) ink.style.transition = 'none';
  ink.style.width = a ? a.offsetWidth + 'px' : '0';
  if (a) { ink.style.height = a.offsetHeight + 'px'; ink.style.top = a.offsetTop + 'px'; ink.style.borderRadius = getComputedStyle(a).borderRadius; }
  ink.style.transform = 'translateX(' + (a ? a.offsetLeft : 0) + 'px)';
  if (fresh) { void ink.offsetWidth; ink.style.transition = ''; }
}
// Entrada suave del contenido al cambiar de pestaña
function _tabFx(el) {
  if (!el) return;
  el.classList.remove('tab-in'); void el.offsetWidth; el.classList.add('tab-in');
}

async function syncDiscordRoles() {
  var btn = document.getElementById('btn-sync-discord-roles');
  var originalText = btn.textContent;
  btn.textContent = 'Sincronizando...';
  btn.disabled = true;
  try {
    var session = await sb.auth.getSession();
    var token = session && session.data && session.data.session ? session.data.session.access_token : '';
    var res = await fetch('/api/discord-roles', { headers: { Authorization: 'Bearer ' + token } });
    var data = await res.json();
    if (!res.ok || data.error) {
      tst('Error al sincronizar: ' + (data.error || res.status), 1);
    } else {
      tst('✓ ' + data.count + ' roles sincronizados desde Discord');
      loadDiscordRoles();
    }
  } catch (e) {
    tst('Error al sincronizar roles', 1);
  }
  btn.textContent = originalText;
  btn.disabled = false;
}

  // sin tener que tocar cada función de modal individualmente.
  var _wpScrollY = 0;
  function _wpLockBody() {
    _wpScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = '-' + _wpScrollY + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  function _wpUnlockBody() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, _wpScrollY);

  var _wpObserver = new MutationObserver(function() {
    var hasOverlay = !!document.querySelector('.wp-overlay');
    var isLocked = document.body.style.position === 'fixed';
    if (hasOverlay && !isLocked) _wpLockBody();
    else if (!hasOverlay && isLocked) _wpUnlockBody();
  });
  _wpObserver.observe(document.body, { childList: true });
}

          '<div class="wp-field"><label class="wp-label">Indicador de TradingView: link de la página del script o su ID (solo si este plan es un indicador)</label><input id="pm-tv" class="wp-input" value="'+(p.tv_pine_id||'')+'" placeholder="Link del script o PUB;abc123..."></div>' +

        // Card: Discord roles
        '<div class="wp-card">' +
          '<div class="wp-card-head"><span class="wp-card-icon">🎭</span><span class="wp-card-title">Roles de Discord que asigna</span></div>' +
          '<div id="pm-discord-roles" style="display:flex;flex-wrap:wrap;gap:7px;"><span class="spin"></span></div>' +
        '</div>' +

        // Card: Variantes
        '<div class="wp-card">' +
          '<div class="wp-card-head" style="justify-content:space-between;">' +
            '<div style="display:flex;align-items:center;gap:9px;"><span class="wp-card-icon">🔀</span><span class="wp-card-title">Variantes (ej. duraciones de Live)</span></div>' +
            (isNew ? '' : '<button class="wp-btn-add" onclick="openVariantModal(\''+p.id+'\',null)">+ Agregar</button>') +
          '</div>' +
          (isNew ? '<div style="font-size:.78rem;color:var(--c-muted);">Guarda el plan primero para poder agregar variantes.</div>' : '') +
          '<div id="pm-variants-list">' +
            (isNew ? '' : (p.variants && p.variants.length ? p.variants.map(function(v) {
              return '<div class="wp-variant-row">' +
                '<span class="wp-variant-name">'+v.name+' — $'+Number(v.price).toLocaleString()+'</span>' +
                '<span><button class="wp-link-btn" style="color:var(--sl);margin-right:12px;" onclick="openVariantModal(\''+p.id+'\',\''+v.id+'\')">Editar</button><button class="wp-link-btn" style="color:rgb(var(--c-bad));" onclick="deleteVariant(\''+v.id+'\',\''+p.id+'\')">Eliminar</button></span>' +
              '</div>';
            }).join('') : '<div style="font-size:.78rem;color:var(--c-muted);">Sin variantes.</div>')) +
          '</div>' +
        '</div>' +

        (isNew ? '' :
          '<div class="wp-callout">' +
            '<label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">' +
              '<input type="checkbox" id="pm-apply-existing" style="width:14px;height:14px;margin-top:2px;accent-color:rgb(var(--c-acc));flex-shrink:0;">' +
              '<span style="font-size:.76rem;color:rgb(var(--c-acc));line-height:1.5;">Aplicar también estos cambios a los alumnos que ya tienen este plan — 1-a-1/roadmap a todos, y Clases solo a quienes la tengan activa ahora mismo (no reactiva a quien ya venció). Live nunca se toca aquí — se protege siempre, activo o vencido. Sin marcar, solo afecta a quienes lo obtengan de ahora en adelante.</span>' +
            '</label>' +
          '</div>'
        ) +

        '<div class="wp-footer">' +
          '<button id="pm-save-btn" class="wp-btn-primary">'+(isNew?'Crear plan':'Guardar cambios')+'</button>' +
          (isNew ? '' : '<button id="pm-delete-btn" class="wp-btn-danger">Eliminar</button>') +
          '<button class="wp-btn-ghost" onclick="document.getElementById(\'plan-edit-modal\').remove();">Cancelar</button>' +
        '</div>' +

      '</div>' + // wp-body
    '</div>'; // wp-modal

  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });

  if (p.tv_pine_id) _admTvList(p);

  // Cargar roles de Discord disponibles como chips (solo los marcados "Disponible",
  // más cualquiera que este plan ya tuviera asignado aunque después se haya ocultado)
  var selectedRoles = (p.discord_role_ids || []);
  sb.from('discord_roles').select('*').order('sort_order').then(function(r) {
    var wrap = document.getElementById('pm-discord-roles');
    if (!wrap) return;
    var allRoles = r.data || [];
    var roles = allRoles.filter(function(role) { return role.active || selectedRoles.indexOf(role.discord_role_id) >= 0; });
    if (!allRoles.length) { wrap.innerHTML = '<span style="font-size:.76rem;color:var(--c-muted);">Sin roles sincronizados — ve a la sección de arriba.</span>'; return; }
    if (!roles.length) { wrap.innerHTML = '<span style="font-size:.76rem;color:var(--c-muted);">No hay roles disponibles — todos están ocultos en la sección de arriba.</span>'; return; }
    wrap.innerHTML = roles.map(function(role) {
      var checked = selectedRoles.indexOf(role.discord_role_id) >= 0;
      return '<label class="wp-chip"><input type="checkbox" class="pm-role-cb" value="'+role.discord_role_id+'" '+(checked?'checked':'')+'>' + role.name + '</label>';
    }).join('');
  });


  document.getElementById('pm-save-btn').addEventListener('click', function() {
    var btn = this; btn.disabled = true; btn.textContent = 'Guardando...';
    var id = isNew ? document.getElementById('pm-id').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-') : p.id;
    if (!id) { tst('El ID del plan es obligatorio', 1); btn.disabled = false; btn.textContent = 'Crear plan'; return; }
    var roleIds = Array.prototype.slice.call(document.querySelectorAll('.pm-role-cb:checked')).map(function(el){ return el.value; });
    var data = {
      id: id,
      name: document.getElementById('pm-name').value.trim(),
      description: document.getElementById('pm-desc').value.trim(),
      price: parseFloat(document.getElementById('pm-price').value) || 0,
      period: document.getElementById('pm-period').value.trim(),
      label: document.getElementById('pm-label').value.trim(),
      color: document.getElementById('pm-color').value,
      duration_clases_months: document.getElementById('pm-dur-clases').value ? parseInt(document.getElementById('pm-dur-clases').value) : null,
      access_clases: document.getElementById('pm-clases').checked,
      duration_live_months: document.getElementById('pm-live').checked ? (document.getElementById('pm-dur-live').value ? parseInt(document.getElementById('pm-dur-live').value) : null) : null,
      category: document.querySelector('input[name="pm-category"]:checked').value,
      roadmap_mode: document.getElementById('pm-roadmap').value,
      access_1on1: document.getElementById('pm-1on1').checked,
      popular: document.getElementById('pm-popular').checked,
      discord_role_ids: roleIds
    };
    var n1 = document.getElementById('pm-1on1-n');
    if (n1 && n1.value !== '') data.sessions_1on1 = parseInt(n1.value, 10);
    if (document.getElementById('pm-store')) {
      data.in_store = document.getElementById('pm-store').checked;
      data.extra_1on1 = parseInt(document.getElementById('pm-extra').value, 10) || 0;
      data.tv_pine_id = document.getElementById('pm-tv').value.trim() || null;
      data.duration_tv_months = document.getElementById('pm-tv-m').value ? parseInt(document.getElementById('pm-tv-m').value, 10) : null;
    }
    if (isNew) { data.active = false; data.sort_order = (window._allPlans || []).length; }

    var op = isNew ? sb.from('checkout_plans').insert(data) : sb.from('checkout_plans').update(data).eq('id', id);
    op.then(function(r) {
      if (r.error) { tst('Error: ' + r.error.message, 1); btn.disabled = false; btn.textContent = isNew ? 'Crear plan' : 'Guardar cambios'; return; }

      var applyExisting = !isNew && document.getElementById('pm-apply-existing') && document.getElementById('pm-apply-existing').checked;
      if (applyExisting) {
        var nowISO = new Date().toISOString();
        var promises = [];

        // 1-a-1 y roadmap: a TODOS los alumnos de este plan, sin excepción (no tienen vencimiento)
        promises.push(sb.from('profiles').update({
          access_1on1: data.access_1on1,
          roadmap_mode: data.roadmap_mode
        }).eq('plan', id));

        // Clases: solo a quienes tienen acceso ACTIVO ahora mismo (no revive a quien ya venció)
        var clasesUpdate;
        if (data.access_clases === false) {
          clasesUpdate = { membership_start: null, membership_end: null };
        } else {
          var clasesEnd = data.duration_clases_months
            ? (function(){ var e = new Date(); e.setMonth(e.getMonth() + data.duration_clases_months); return e.toISOString(); })()
            : UNLIMITED_ISO;
          clasesUpdate = { membership_start: new Date().toISOString(), membership_end: clasesEnd };
        }
        promises.push(sb.from('profiles').update(clasesUpdate).eq('plan', id).gt('membership_end', nowISO));

        // Live NUNCA se toca aquí — ni activo ni vencido. Es un servicio recurrente con
        // valor monetario real; extenderlo o reactivarlo sin que el alumno haya pagado
        // de nuevo no sería justo. Si el plan cambia su duración de Live, eso solo aplica
        // a quienes lo obtengan de ahora en adelante (compra, código, o asignación manual).

        Promise.all(promises).then(function(results) {
          modal.remove();
          var anyError = results.some(function(r){ return r.error; });
          if (anyError) tst('Plan guardado, pero algo falló al aplicar a alumnos existentes', 1);
          else tst('✓ Plan actualizado y aplicado a alumnos activos');
          loadPlansAdmin();
        });
      } else {
        tst(isNew ? '✓ Plan creado (queda oculto — actívalo cuando esté listo)' : '✓ Plan actualizado');
        modal.remove();
        loadPlansAdmin();
      }
    });
  });

  if (!isNew) {
    document.getElementById('pm-delete-btn').addEventListener('click', function() {
      if (!confirm('¿Eliminar el plan "'+p.name+'"? Esto no afecta a los alumnos que ya lo tienen asignado, solo deja de estar disponible para nuevos.')) return;
      sb.from('checkout_plans').delete().eq('id', p.id).then(function(r) {
        if (r.error) return tst('Error: ' + r.error.message, 1);
        tst('✓ Plan eliminado');
        modal.remove();
        loadPlansAdmin();
      });
    });
  }
}

// ── MODAL: crear/editar variante ──
// Admin: quién tiene acceso al indicador + dar acceso a mano (respaldo si TradingView falla)
function _admTvList(p) {
  var box = document.getElementById('pm-tv-list'); if (!box) return;
  sb.from('tv_access').select('*').eq('pine_id', p.tv_pine_id).order('updated_at', { ascending: false }).then(function(r) {
    var rows = (r && r.data) || [];
    var ids = rows.map(function(x) { return x.user_id; });
    (ids.length ? sb.from('profiles').select('id, full_name, email').in('id', ids) : Promise.resolve({ data: [] })).then(function(pr) {
      var who = {}; ((pr && pr.data) || []).forEach(function(x) { who[x.id] = x; });
      var f = function(d) { return d ? new Date(d).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) : 'De por vida'; };
      box.innerHTML = '<div class="wp-label" style="margin-bottom:6px;">Alumnos con acceso (' + rows.length + ')</div>' +
        (rows.length ? rows.map(function(x) {
          var w = who[x.user_id] || {};
          return '<div class="wp-variant-row"><span class="wp-variant-name">' + _mkEsc(w.full_name || w.email || 'Alumno') + ' · ' + _mkEsc(x.tv_username) + ' · ' + f(x.expires_at) +
            (x.status === 'error' ? ' · <b style="color:rgb(var(--c-bad));font-weight:600;">No se pudo dar</b>' : '') + '</span>' +
            (x.status === 'error' ? '<button class="wp-link-btn" style="color:var(--sl);" data-tvretry="' + x.user_id + '">Reintentar</button>' : '') + '</div>';
        }).join('') : '<div style="font-size:.78rem;color:var(--c-muted);">Nadie todavía.</div>') +
        '<div class="wp-label" style="margin:14px 0 6px;">Dar acceso a mano</div>' +
        '<div class="wp-grid2" style="gap:8px;"><input id="tv-g-email" class="wp-input" placeholder="Email del alumno"><input id="tv-g-user" class="wp-input" placeholder="Usuario de TradingView"></div>' +
        '<div class="wp-grid2" style="gap:8px;margin-top:8px;"><input id="tv-g-m" type="number" min="0" class="wp-input" placeholder="Meses (vacío = de por vida)"><button class="wp-btn-primary" id="tv-g-btn" style="margin:0;">Dar acceso</button></div>';
      var call = function(body, done) {
        sb.auth.getSession().then(function(s) {
          var t = s && s.data && s.data.session ? s.data.session.access_token : '';
          fetch('/api/cart', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify(Object.assign({ action: 'tv_grant', plan_id: p.id }, body)) })
            .then(function(r) { return r.json(); }).then(function(j) { tst(j.ok ? '✓ Acceso dado en TradingView' : 'No se pudo: ' + (j.error || 'error'), !j.ok); _admTvList(p); if (done) done(); })
            .catch(function() { tst('No se pudo conectar', 1); if (done) done(); });
        });
      };
      box.querySelectorAll('[data-tvretry]').forEach(function(b) { b.onclick = function() { b.disabled = true; call({ user_id: b.dataset.tvretry, retry: true }); }; });
      document.getElementById('tv-g-btn').onclick = function() {
        var btn = this, em = document.getElementById('tv-g-email').value.trim().toLowerCase();
        if (!em) return tst('Escribe el email del alumno', 1);
        btn.disabled = true;
        sb.from('profiles').select('id').ilike('email', em).maybeSingle().then(function(q) {
          if (!q || !q.data) { btn.disabled = false; return tst('No hay un alumno con ese email', 1); }
          call({ user_id: q.data.id, tv_username: document.getElementById('tv-g-user').value.trim(), months: document.getElementById('tv-g-m').value || 0 }, function() { btn.disabled = false; });
        });
      };
    });
  });
}

function _toggleCodeType(type) {
  document.getElementById('code-free-block').style.display = type === 'free' ? '' : 'none';
  document.getElementById('code-discount-block').style.display = type === 'discount' ? '' : 'none';
  document.getElementById('code-plan-label').textContent = type === 'free' ? 'Plan que activa' : 'Plan al que aplica el descuento';
}

function genCode() {
  var note = document.getElementById('code-note').value.trim();
  var plan = document.getElementById('code-plan') ? document.getElementById('code-plan').value : '';
  var codeType = document.querySelector('input[name="code-type"]:checked').value;
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = 'KATANA-';
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];

  var data = { code: code, created_by: cUser.id, plan: plan, notes: note, code_type: codeType };

  if (codeType === 'free') {
    var customDur = document.getElementById('code-custom-dur').checked;
    data.custom_duration = customDur;
    if (customDur) {
      var appliesClases = document.getElementById('code-applies-clases').checked;
      var appliesLive = document.getElementById('code-applies-live').checked;
      var months = parseInt(document.getElementById('code-months').value) || 1;
      data.applies_clases = appliesClases;
      data.applies_live = appliesLive;
      data.months = months; // se guarda igual, para compatibilidad con lecturas existentes
    } else {
      data.applies_clases = false;
      data.applies_live = false;
      data.months = null;
    }
  } else {
    data.discount_type = document.getElementById('code-discount-type').value;
    data.discount_value = parseFloat(document.getElementById('code-discount-value').value) || 0;
  }

  sb.from('access_codes').insert(data).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Código generado: ' + code);
    loadCodes();
  });
}

function dCode(id) {
  if (!confirm('¿Eliminar este código de acceso?')) return;
  sb.from('access_codes').delete().eq('id', id).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Código eliminado');
    loadCodes();
  });
}
function loadCodes() {
  var c = document.getElementById('codes-list'); if (!c) return;
  sb.from('access_codes').select('*').order('created_at', {ascending: false}).then(function(r) {
    if (!r.data || !r.data.length) { c.innerHTML = '<p style="color:var(--c-muted);font-size:.82rem;">Sin códigos generados aún.</p>'; return; }
    var tbl = document.createElement('table'); tbl.className = 'dtab';
    tbl.innerHTML = '<thead><tr><th>Código</th><th>Nota</th><th>Detalle</th><th>Estado</th><th>Usado</th><th></th></tr></thead>';
    var tb = document.createElement('tbody');
    r.data.forEach(function(cd) {
      var tr = document.createElement('tr');
      var usedDate = cd.used_at ? new Date(cd.used_at).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : '—';
      var detail;
      if (cd.code_type === 'discount') {
        detail = '<span style="color:rgb(var(--c-acc));">' + (cd.discount_type === 'percent' ? cd.discount_value + '% off' : '$' + cd.discount_value + ' off') + '</span>';
      } else if (cd.custom_duration) {
        var parts = [];
        if (cd.applies_clases) parts.push('Clases');
        if (cd.applies_live) parts.push('Live');
        detail = cd.months + ' mes' + (cd.months===1?'':'es') + ' (' + (parts.join(' + ') || '—') + ')';
      } else {
        detail = 'Duración del plan';
      }
      tr.innerHTML =
        '<td><span style="font-family:monospace;font-size:.82rem;color:var(--c-text);letter-spacing:1px;">' + cd.code + '</span>' +
        '<button onclick="navigator.clipboard.writeText(\'' + cd.code + '\').then(function(){tst(\'✓ Copiado\')})" style="background:none;border:none;color:var(--c-muted);cursor:pointer;font-size:.7rem;margin-left:6px;padding:2px 5px;border:1px solid var(--br);border-radius:3px;">Copiar</button></td>' +
        '<td style="font-size:.74rem;color:var(--c-muted);">' + (cd.notes || '—') + '</td>' +
        '<td style="font-size:.74rem;">' + detail + '</td>' +
        '<td><span style="font-size:.68rem;padding:2px 8px;border-radius:3px;background:' + (cd.is_used ? 'rgba(var(--c-bad),.1)' : 'rgba(var(--c-ok),.1)') + ';color:' + (cd.is_used ? 'rgb(var(--c-bad))' : 'rgb(var(--c-ok))') + ';">' + (cd.is_used ? 'Usado' : 'Disponible') + '</span></td>' +
        '<td style="font-size:.74rem;color:var(--c-muted);">' + usedDate + '</td>' +
        '<td></td>';
      {
        var delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.style.cssText = 'background:rgba(var(--c-bad),.08);border:1px solid rgba(var(--c-bad),.18);color:rgb(var(--c-bad));padding:3px 9px;border-radius:2px;font-size:.71rem;cursor:pointer;';
        delBtn.addEventListener('click', function() { dCode(cd.id); });
        tr.cells[tr.cells.length-1].appendChild(delBtn);
      }
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    c.innerHTML = '';
    var w = document.createElement('div'); w.className = 'dtab-wrap'; w.appendChild(tbl); c.appendChild(w);
  });
}

function rAdmSe() {
  var c = document.getElementById('a-se'); if (!c) return;
  c.innerHTML =
    '<div class="aform">' +
      '<div style="font-size:.86rem;font-weight:600;margin-bottom:14px;">➕ Programar sesión</div>' +
      '<div style="margin-bottom:9px;">' +
        '<label class="al">Título</label><input id="s-t" class="ai" placeholder="Pre-Market ES Futuros">' +
      '</div>' +
      '<div class="ses-dt-grid">' +
        '<div><label class="al">Inicio</label><input id="s-d" type="datetime-local" class="ai ses-dt-input"></div>' +
        '<div><label class="al">Fin (auto-desactivar)</label><input id="s-end" type="datetime-local" class="ai ses-dt-input"></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;">' +
        '<div><label class="al">Link Discord</label><input id="s-u" class="ai" placeholder="https://discord.gg/..."></div>' +
        '<div><label class="al">Descripción</label><input id="s-desc" class="ai" placeholder="Descripción opcional"></div>' +
      '</div>' +
      '<div style="display:flex;gap:11px;align-items:center;margin-top:11px;">' +
        '<button onclick="cSe()" class="abtn2">Programar</button>' +
        '<label style="display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--c-text2);cursor:pointer;"><input type="checkbox" id="s-act"> Activar ahora</label>' +
      '</div>' +
    '</div>' +
    '<div id="se-t"><span class="spin"></span></div>';

  sb.from('live_sessions').select('*').order('scheduled_at', {ascending: false}).then(function(r) {
    var t = document.getElementById('se-t'); if (!t) return;
    if (!r.data || !r.data.length) {
      t.innerHTML = '<p style="color:var(--c-muted);padding:14px 0;font-size:.82rem;">Sin sesiones.</p>';
      return;
    }

    t.innerHTML = '';
    var now = new Date();

    // Split into upcoming and past
    var upcoming = r.data.filter(function(s){ return new Date(s.scheduled_at) >= now || s.is_active; });
    var past     = r.data.filter(function(s){ return new Date(s.scheduled_at) < now && !s.is_active; });

    // ── Render a paginated list into a container ──
    function renderPaginatedList(container, items, pageSize) {
      var page = 0;
      function render() {
        var slice = items.slice(0, (page + 1) * pageSize);
        var hasMore = items.length > slice.length;
        container.innerHTML = '';
        slice.forEach(function(s) {
          var card = document.createElement('div');
          card.id = 'ses-card-' + s.id;
          card.style.cssText = 'background:rgba(var(--c-ov),.02);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:10px;';
          var dateStr = new Date(s.scheduled_at).toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
          var timeStr = new Date(s.scheduled_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
          card.innerHTML =
            '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;">' +
              '<div>' +
                '<div style="font-size:.86rem;font-weight:600;color:var(--c-text);">' + (s.title||'') + '</div>' +
                '<div style="font-size:.72rem;color:var(--c-muted);margin-top:2px;">' + dateStr + ' · ' + timeStr + '</div>' +
                (s.description ? '<div style="font-size:.72rem;color:var(--c-muted);margin-top:2px;">' + s.description + '</div>' : '') +
              '</div>' +
              '<label style="cursor:pointer;display:flex;align-items:center;gap:5px;font-size:.72rem;color:' + (s.is_active?'rgb(var(--c-ok))':'var(--c-muted)') + ';flex-shrink:0;">' +
                '<input type="checkbox" ' + (s.is_active?'checked':'') + ' data-id="' + s.id + '" onchange="togSe(this.dataset.id, this.checked)"> ' +
                (s.is_active ? 'Activo' : 'Inactivo') +
              '</label>' +
            '</div>' +
            '<div style="margin-bottom:10px;">' +
              '<label class="al">URL Grabación (YouTube)</label>' +
              '<div style="display:flex;gap:8px;">' +
                '<input id="rec-' + s.id + '" class="ai" style="flex:1;" placeholder="https://youtube.com/embed/..." value="' + (s.recording_url||'') + '">' +
                '<button onclick="saveRec(this.dataset.id)" data-id="' + s.id + '" style="background:rgba(var(--c-acc),.12);border:1px solid rgba(var(--c-acc),.25);color:var(--sl);padding:6px 12px;border-radius:6px;font-size:.72rem;cursor:pointer;white-space:nowrap;">Guardar</button>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex;gap:8px;">' +
              '<button onclick="openEditSe(this.dataset.id)" data-id="' + s.id + '" style="flex:1;background:rgba(var(--c-acc),.1);border:1px solid rgba(var(--c-acc),.2);color:var(--sl);padding:6px;border-radius:6px;font-size:.72rem;cursor:pointer;">✎ Editar</button>' +
              '<button onclick="dSe(this.dataset.id)" data-id="' + s.id + '" style="background:rgba(var(--c-bad),.08);border:1px solid rgba(var(--c-bad),.18);color:rgb(var(--c-bad));padding:6px 12px;border-radius:6px;font-size:.72rem;cursor:pointer;">✕</button>' +
            '</div>';
          container.appendChild(card);
        });
        // Ver más button
        var oldBtn = container.querySelector('.ses-more-btn');
        if (oldBtn) oldBtn.remove();
        if (hasMore) {
          var btn = document.createElement('button');
          btn.className = 'ses-more-btn';
          btn.textContent = 'Ver 5 más ↓';
          btn.style.cssText = 'width:100%;padding:10px;margin-top:4px;background:rgba(var(--c-acc),.08);border:1px solid rgba(var(--c-acc),.2);color:var(--sl);border-radius:8px;font-size:.78rem;cursor:pointer;';
          btn.addEventListener('click', function(){ page++; render(); });
          container.appendChild(btn);
        }
      }
      render();
    }

    // ── PRÓXIMAS SESIONES ──
    var upcomingWrap = document.createElement('div');
    upcomingWrap.style.cssText = 'margin-bottom:20px;';
    var upcomingLabel = document.createElement('div');
    upcomingLabel.style.cssText = 'font-size:.68rem;color:var(--c-text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--br);';
    upcomingLabel.textContent = 'Próximas sesiones';
    upcomingWrap.appendChild(upcomingLabel);
    if (upcoming.length) {
      renderPaginatedList(upcomingWrap, upcoming, 5);
    } else {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--c-muted);font-size:.8rem;padding:10px 0;';
      empty.textContent = 'Sin sesiones próximas.';
      upcomingWrap.appendChild(empty);
    }
    t.appendChild(upcomingWrap);

    // ── SESIONES PASADAS (colapsable) ──
    var pastWrap = document.createElement('div');
    var pastHeader = document.createElement('div');
    pastHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-top:1px solid var(--br);margin-bottom:0;';
    pastHeader.innerHTML =
      '<div style="font-size:.68rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:1.5px;">Sesiones pasadas / grabaciones (' + past.length + ')</div>' +
      '<svg id="past-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" style="transition:.2s;"><path d="M6 9l6 6 6-6"/></svg>';
    var pastList = document.createElement('div');
    pastList.id = 'past-ses-list';
    pastList.style.display = 'none';
    pastHeader.addEventListener('click', function() {
      var open = pastList.style.display !== 'none';
      pastList.style.display = open ? 'none' : 'block';
      var arrow = document.getElementById('past-arrow');
      if (arrow) arrow.style.transform = open ? '' : 'rotate(180deg)';
      if (!open && !pastList.dataset.loaded) {
        pastList.dataset.loaded = '1';
        renderPaginatedList(pastList, past, 5);
      }
    });
    pastWrap.appendChild(pastHeader);
    pastWrap.appendChild(pastList);
    t.appendChild(pastWrap);
  });
}

function saveSe(id) {
  var t = (document.getElementById('es-t')||{}).value || '';
  var d = (document.getElementById('es-d')||{}).value || '';
  if (!t || !d) return tst('Título y fecha requeridos', 1);
  var btn = document.getElementById('es-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  var endV = (document.getElementById('es-end')||{}).value || '';
  sb.from('live_sessions').update({
    title: t.trim(),
    scheduled_at: new Date(d).toISOString(),
    end_time: endV ? new Date(endV).toISOString() : null,
    discord_url: (document.getElementById('es-u')||{}).value.trim() || '',
    description: (document.getElementById('es-desc')||{}).value.trim() || '',
  }).eq('id', id).then(function(r) {
    if (r.error) { tst('Error: ' + r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
    tst('✓ Sesión actualizada');
    var m = document.getElementById('edit-se-modal');
    if (m) m.remove();
    rAdmSe();
  });
}

function cSe() {
  var t = document.getElementById('s-t').value.trim();
  var d = document.getElementById('s-d').value;
  if (!t || !d) return tst('Título y fecha requeridos', 1);
  var endVal = document.getElementById('s-end').value;
  sb.from('live_sessions').insert({
    title: t,
    scheduled_at: new Date(d).toISOString(),
    end_time: endVal ? new Date(endVal).toISOString() : null,
    discord_url: document.getElementById('s-u').value.trim(),
    description: document.getElementById('s-desc').value.trim(),
    is_active: document.getElementById('s-act').checked,
    recording_url: null,
  }).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Programada');
    document.getElementById('s-t').value = '';
    document.getElementById('s-d').value = '';
    document.getElementById('s-u').value = '';
    document.getElementById('s-desc').value = '';
    document.getElementById('s-act').checked = false;
    rAdmSe();
  });
}

function togSe(id, v) {
  sb.from('live_sessions').update({
    is_active: v,
    manually_deactivated: v ? false : true
  }).eq('id', id).then(function() {
    if (v) _liveNotify(id);
    tst(v ? '✓ Sesión activada' : 'Sesión desactivada');
    rAdmSe();
  });
}

function dSe(id) {
  if (!confirm('¿Eliminar esta sesión?')) return;
  sb.from('live_sessions').delete().eq('id', id).then(function() {
    tst('Eliminada'); rAdmSe();
  });
}


function toggleActMenu(btn) {
  document.querySelectorAll('.act-menu').forEach(function(m) {
    if (m !== btn.nextElementSibling) m.style.display = 'none';
  });
  var menu = btn.nextElementSibling;
  if (!menu) return;
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }

  // Render offscreen to measure
  menu.style.cssText = menu.style.cssText + ';position:fixed;visibility:hidden;display:block;top:-9999px;left:-9999px;';
  var menuH = menu.offsetHeight || 88;
  var menuW = menu.offsetWidth  || 150;

  var rect      = btn.getBoundingClientRect();
  // Mobile nav bar is 58px; add 8px safety margin
  var safeBottom = window.innerHeight - (window.innerWidth <= 860 ? 68 : 12);
