; Kairus Journal: configuración privada del VPS.
; Copia este archivo como config.ini (en la misma carpeta) y llénalo.
; NUNCA compartas config.ini ni lo subas a GitHub.

[supabase]
url = https://rxyezbyvwqwihggechsc.supabase.co
; Si los dejas vacíos, se usan los que ya guardaste en el VPS con setx
; (SUPABASE_SERVICE_KEY y JOURNAL_KEY).
service_key =
journal_key =

[journal]
; Carpeta donde están los MT5 del Journal. La app se niega a usar cualquier MT5 fuera de aquí.
carpeta = C:\Journal
; Cuentas con operaciones abiertas o que operaron hoy: cada cuántos minutos
cada_min_activas = 5
; Cuentas sin actividad: cada cuántos minutos
cada_min_inactivas = 45
; Cuentas sin operar en estos días (y sin operaciones abiertas) "duermen": se leen 1 vez al día.
; Si el alumno vuelve a operar, en menos de un día vuelve al ritmo normal. No se borra nada.
dias_para_dormir = 60
cada_min_dormidas = 1440
; Cuentas con error: cada cuántos minutos se vuelve a intentar
reintentar_error_min = 15
; Si solo cambió la equity, se guarda como mucho cada estos minutos
equity_min = 60
; Margen hacia atrás en cada lectura (horas)
margen_horas = 2
login_timeout_seg = 20
; si = empieza a sincronizar apenas se abre la app
arrancar_solo = si

[exness_partner]
; Opcional. Vacío = no se revisa el link de partner (o se usa lo guardado con setx).
email =
password =

[terminales]
; nombre = bróker | ruta al terminal64.exe de una copia PORTABLE del Journal
; bróker: todos (entra a Exness y a Funding Pips), exness o fundingpips. Una línea por copia.
; Cada copia alcanza para unos 100 alumnos. Para más, agrega MT5-2, MT5-3...
MT5-1 = todos | C:\Journal\MT5-1\terminal64.exe
; MT5-2 = todos | C:\Journal\MT5-2\terminal64.exe
