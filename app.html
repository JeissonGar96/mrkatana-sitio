    html += '<div class="mk-sh" style="margin-top:28px;"><h3>Grabaciones recientes</h3>' + (past.length > 6 ? '<a class="mk-link" href="#" onclick="document.querySelectorAll(\'.rec-more\').forEach(function(e){e.style.display=\'\'});this.remove();return false;">Ver todas →</a>' : '') + '</div>';

        return '<div class="cw-card' + (i >= 6 ? ' rec-more' : '') + '"' + (i >= 6 ? ' style="display:none"' : '') + (ed && !x.recording_url ? ' onclick="openLiveModal(this.dataset.id)" data-id="' + x.id + '" ' : ' onclick="openRecModal(this.dataset.title, this.dataset.date, this.dataset.url)" ') +
          'data-title="' + _mkEsc(x.title) + '" data-date="' + d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' }) + '" data-url="' + _mkEsc(toEmbedUrl(x.recording_url || '')) + '">' +

          (ed && !x.recording_url ? '<span class="lv-rec-miss">Falta grabación</span>' : '') +
          (ed ? '<div class="ce-tools"><button class="ce-ic" title="Editar" data-lv="edit" data-id="' + x.id + '">' + CE_IC.edit + '</button><button class="ce-ic r" title="Eliminar" data-lv="del" data-id="' + x.id + '">' + CE_IC.del + '</button></div>' : '') +
          '<span class="cw-tag b">' + _mkEsc(tag) + '</span>' +
          '<div class="cw-tit">' + _mkEsc(x.title) + '</div>' +
        '</div>';
      }).join('') + (ed ? '<div class="lv-add" data-lv="rec">' + CE_IC.plus + '<span>Agregar grabación</span></div>' : '') + '</div>';
    }

    m.innerHTML = html;

    if (_lvAutoJoin) { var aj = _lvAutoJoin; _lvAutoJoin = null; setTimeout(function(){ _lvJoinRoom(aj.id, aj.title); }, 0); }
    if (ed && !m._lvBound) m._lvBound = true, m.addEventListener('click', function(e) {
      var b = e.target.closest('[data-lv]'); if (!b || !m.contains(b)) return;

      else if (a === 'off') _liveToggle(id, false);
      else if (a === 'new') openLiveModal(null);

    }, true);

    // ── Bind join button ──

    });

    if (joinBtn) {
      joinBtn.addEventListener('click', function() {
        var discordUrl = this.getAttribute('data-url');
        // El gate obligatorio del primer login garantiza que ya está conectado
        if (discordUrl) window.open(discordUrl, '_blank');

    }
  });
}

function _canEditLive() {

}
function _liveToggle(id, v) {
  sb.from('live_sessions').update({ is_active: v, manually_deactivated: !v }).eq('id', id).then(function(r) {
    if (r && r.error) return tst('Error: ' + r.error.message, 1);

function _liveDel(id) {

  sb.auth.getSession().then(function(r) {

    return fetch('/api/jaas-token?' + (opts.meeting ? 'meeting=' : 'session=') + encodeURIComponent(sessionId), { headers: { Authorization: 'Bearer ' + tk } });
  }).then(function(res) {
    return res.text().then(function(t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw new Error('http_' + res.status); }
      if (!res.ok) { var er = new Error(j.error || ('http_' + res.status)); er.detail = j.detail || ''; throw er; }
      return j;
    });
  }).then(function(j) {
    return _lvLoadJitsi(j.appId).then(function() { return j; }, function() { throw new Error('jitsi_script'); });
  }).then(function(j) {
    var box = document.getElementById('lv-room-box'); if (!box) return;
    box.innerHTML = '';
    _lvApi = new JitsiMeetExternalAPI('8x8.vc', {
      roomName: j.room,
      jwt: j.jwt,
      parentNode: box,
      width: '100%',
      height: '100%',
      lang: 'es',
      configOverwrite: {
        prejoinPageEnabled: false,
        prejoinConfig: { enabled: false },
        defaultLanguage: 'es',
        startWithAudioMuted: true,
        startWithVideoMuted: true,
        disableDeepLinking: true,
        subject: title || 'Sesión en vivo'
      }
    });
    _lvApi.addListener('readyToClose', _lvLeaveRoom);
  }).catch(function(e) {
    var box = document.getElementById('lv-room-box');
    console.error('[En vivo] no se pudo abrir la sala:', e);
    var code = (e && e.message) || 'desconocido';
    if (box) box.innerHTML = '<div class="lv-room-wait" style="flex-direction:column;">' + _mkEsc(msgs[code] || 'No se pudo abrir la sesión. Intenta de nuevo en un momento.') +
      (msgs[code] ? '' : '<small style="opacity:.55;font-size:.72rem;">Código: ' + _mkEsc(code + (e && e.detail ? ' · ' + e.detail : '')) + '</small>') + '</div>';
  });
}

// ── REUNIONES ──
function rReun() {
  if (_lvApi && document.getElementById('lv-room-box')) return; // no cortar una llamada en curso
  var m = document.getElementById('amain');
  m.innerHTML = _mkSkelTab();

  var now = new Date();

  // Load meetings and recordings in parallel
  Promise.all([
    sb.from('meetings_1on1').select('*').eq('student_id', cUser.id).order('scheduled_at'),
    sb.from('recordings_1on1').select('*').eq('student_id', cUser.id).order('recorded_at', {ascending: false}),
    cProfile && cProfile.plan ? sb.from('checkout_plans').select('*').eq('id', cProfile.plan).maybeSingle() : Promise.resolve({ data: null })
  ]).then(function(res) {
    var meetings   = res[0].data || [];
    var recordings = res[1].data || [];
    var planRow    = res[2] && res[2].data;

    var upcoming = meetings.filter(function(m){ return m.status !== 'cancelled' && new Date(m.scheduled_at) >= new Date(now.getTime() - 1800000); });
    var past     = meetings.filter(function(m){ return new Date(m.scheduled_at) < new Date(now.getTime() - 1800000) && m.status !== 'no_show' && m.status !== 'cancelled'; });

    var html = '<div class="mk-row2" style="grid-template-columns:1.2fr 1fr;">';
    // ── PRÓXIMA SESIÓN 1-1 (cuenta regresiva) ──
    if (upcoming.length) {
      var next = upcoming[0];
      var nd = new Date(next.scheduled_at);
      html += '<div class="mk-card mk-next"><div class="mk-ic big">' + MK_IC.cal.replace(/18/g, '26') + '</div>' +
        '<div style="flex:1;min-width:0;"><div class="mk-lbl">Próxima sesión 1-1</div><div class="mk-count" id="reu-count">—</div>' +
        '<div class="mk-live-sub">' + _mkEsc(next.title || 'Sesión 1-1') + ' · ' + nd.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + nd.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</div>' + (next.meet_url ? '' : '<div class="reu-hint" id="reu-hint"></div>') + '</div>' +
        (next.meet_url ? '<a class="mk-btn" href="' + _mkEsc(_mkSafeUrl(next.meet_url)) + '" target="_blank" rel="noopener">Entrar</a>' : '<button class="mk-btn" id="reu-join" data-id="' + _mkEsc(next.id) + '" data-t="' + _mkEsc(next.title || 'Sesión 1-1') + '">Entrar a la llamada</button>') +
      '</div>';
      setTimeout(function tick() {
        var el = document.getElementById('reu-count'); if (!el) return;
        var df = nd - new Date();
        // La sala 1-1 se abre 10 minutos antes de la hora
        var jb = document.getElementById('reu-join'), hn = document.getElementById('reu-hint');
        if (jb) { var open = df <= 600000; jb.disabled = !open; jb.classList.toggle('off', !open); if (hn) hn.textContent = open ? 'Tu sala privada está abierta. Entra cuando quieras.' : 'El botón se activa 10 minutos antes. La llamada es dentro de la app, solo tú y Jeisson.'; }
        if (df <= 0) { el.textContent = '¡Ahora!'; return; }
        var D = Math.floor(df / 86400000), H = Math.floor(df % 86400000 / 3600000), M = Math.floor(df % 3600000 / 60000);
        el.textContent = D + 'd : ' + String(H).padStart(2, '0') + 'h : ' + String(M).padStart(2, '0') + 'm';
        setTimeout(tick, 30000);
      }, 0);
    } else {
      html += '<div class="mk-card mk-next"><div class="mk-ic big">' + MK_IC.cal.replace(/18/g, '26') + '</div><div><div class="mk-lbl">Próxima sesión 1-1</div><div class="mk-live-sub" style="margin-top:6px;">Sin sesiones programadas. Escríbele a Jeisson para agendar.</div></div></div>';
    }
    // ── TU PLAN 1-1 ──
    // Total = sesiones que trae su plan (3 por defecto); hechas = las que ya pasaron y no fueron canceladas ni faltó
    var doneN = past.length, totN = planRow && planRow.sessions_1on1 != null ? planRow.sessions_1on1 : 3;
    if (doneN > totN) totN = doneN;
    var end = cProfile && cProfile.membership_end ? new Date(cProfile.membership_end) : null;
    var endS = !end ? '—' : end.getFullYear() >= 2099 ? 'Ilimitado' : end.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
    html += '<div class="mk-card"><div class="mk-lbl">Tu plan 1-1</div>' +
      '<div class="mk-count" style="font-size:1.9rem;margin:4px 0 10px;">' + doneN + ' de ' + totN + ' sesiones</div>' +
      '<div class="lvl-bar"><i style="width:' + (totN ? Math.round(doneN / totN * 100) : 0) + '%"></i></div>' +
      '<div class="cw-ft" style="margin-top:8px;"><span>' + upcoming.length + ' programada' + (upcoming.length === 1 ? '' : 's') + '</span><span>Vence: ' + endS + '</span></div></div>';
    html += '</div>';

    // ── TABLA: reuniones + grabaciones ──
    var recUsed = {};
    var rows = meetings.slice().sort(function(x, y){ return new Date(y.scheduled_at) - new Date(x.scheduled_at); }).map(function(mt) {
      var md = new Date(mt.scheduled_at), key = md.toDateString();
      var rec = recordings.find(function(r){ return !recUsed[r.id] && r.recorded_at && new Date(r.recorded_at).toDateString() === key; });
      if (rec) recUsed[rec.id] = true;
      return { d: md, t: mt.title || 'Sesión 1-1', future: mt.status !== 'cancelled' && md >= new Date(now.getTime() - 1800000), rec: rec, url: mt.meet_url, st: mt.status };
    });
    recordings.forEach(function(r){ if (!recUsed[r.id]) rows.push({ d: new Date(r.recorded_at), t: r.title || 'Grabación', future: false, rec: r }); });
    rows.sort(function(x, y){ return y.d - x.d; });
    html += '<div class="mk-sh" style="margin-top:28px;"><h3>Mis reuniones y grabaciones</h3><a class="mk-link" href="https://wa.me/593995014247?text=' + encodeURIComponent('Hola Jeisson, quiero agendar una sesión 1-1') + '" target="_blank" rel="noopener">Agendar nueva →</a></div>';
    if (!rows.length) {
      html += '<div class="mk-empty">Aún no tienes reuniones ni grabaciones.</div>';
    } else {
      html += '<div class="mk-card mk-tbl-wrap"><table class="mk-tbl"><thead><tr><th>Fecha</th><th>Tema</th><th>Estado</th><th>Grabación</th></tr></thead><tbody>' +
        rows.map(function(x) {
          var recBtn = x.rec
            ? '<button class="mk-chip" onclick="openRecModal(this.dataset.title,this.dataset.date,this.dataset.url)" data-title="' + _mkEsc(x.rec.title || x.t) + '" data-date="' + x.d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' }) + '" data-url="' + _mkEsc(toEmbedUrl(x.rec.video_url || '')) + '">▶ Ver grabación</button>'
            : (x.future && x.url ? '<a class="mk-chip" href="' + _mkEsc(_mkSafeUrl(x.url)) + '" target="_blank" rel="noopener">Entrar</a>' : '<span style="color:var(--c-muted);">' + (x.future ? 'Disponible luego' : '—') + '</span>');
          return '<tr><td>' + x.d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) + '</td><td>' + _mkEsc(x.t) + '</td>' +
            '<td>' + (x.future ? '<span class="mk-pill b">Programada</span>' : x.st === 'no_show' ? '<span class="mk-pill r">No asistió</span>' : x.st === 'cancelled' ? '<span class="mk-pill">Cancelada</span>' : '<span class="mk-pill g">Completada</span>') + '</td><td>' + recBtn + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    m.innerHTML = html;
    var jb = document.getElementById('reu-join');
    if (jb) jb.addEventListener('click', function() { if (!jb.disabled) _lvJoinRoom(jb.dataset.id, jb.dataset.t, { meeting: true }); });
  });
}

// ── TOGGLE VISTA GRABADAS ──
function _applyRecView(prefix, v) {
  var list = document.getElementById(prefix+'-rec-list');
  var grid = document.getElementById(prefix+'-rec-grid');
  var btnL = document.getElementById(prefix+'-tog-list');
  var btnG = document.getElementById(prefix+'-tog-grid');
  if (!list || !grid) return;
  var isGrid = v === 'grid';
  list.style.display = isGrid ? 'none' : 'block';
  grid.style.display = isGrid ? 'grid' : 'none';
  if (btnL) { btnL.style.background = isGrid ? 'transparent' : 'rgba(var(--c-acc),.15)'; btnL.style.borderColor = isGrid ? 'rgba(var(--c-ov),.08)' : 'rgba(var(--c-acc),.3)'; btnL.style.color = isGrid ? 'var(--c-muted)' : 'var(--sl)'; }
  if (btnG) { btnG.style.background = isGrid ? 'rgba(var(--c-acc),.15)' : 'transparent'; btnG.style.borderColor = isGrid ? 'rgba(var(--c-acc),.3)' : 'rgba(var(--c-ov),.08)'; btnG.style.color = isGrid ? 'var(--sl)' : 'var(--c-muted)'; }
}
function setSesView(v) {
  try { localStorage.setItem('mrk_sesview', v); } catch(e){}
  _applyRecView('ses', v);
}
function setReuView(v) {
  try { localStorage.setItem('mrk_reuview', v); } catch(e){}
  _applyRecView('reu', v);
}
// Called after rSes / rReun render to restore saved preference
function restoreSesView() {
  var v = 'list'; try { v = localStorage.getItem('mrk_sesview') || 'list'; } catch(e){}
  _applyRecView('ses', v);
}
function restoreReuView() {
  var v = 'list'; try { v = localStorage.getItem('mrk_reuview') || 'list'; } catch(e){}
  _applyRecView('reu', v);
}

function savePerfil() {
  var name   = (document.getElementById('pf-name')         ||{}).value.trim();
  var dobD  = (document.getElementById('pf-dob-d')||{}).value || '';
  var dobM  = (document.getElementById('pf-dob-m')||{}).value || '';
  var dobY  = (document.getElementById('pf-dob-y')||{}).value || '';
  var dob   = (dobD && dobM && dobY) ? dobY+'-'+dobM+'-'+dobD : null;
  var country= (document.getElementById('pf-country')      ||{}).value.trim();
  var prefix = (document.getElementById('pf-phone-prefix') ||{}).value || '+593';
  var phone  = (document.getElementById('pf-phone')        ||{}).value.trim();
  var exp    = (document.getElementById('pf-exp')          ||{}).value;
  var bio    = (document.getElementById('pf-bio')          ||{}).value.trim();
  if (!name) return tst('El nombre es requerido', 1);

  // Calculate age from dob
  var age = null;
  if (dob) {
    var today = new Date(), birth = new Date(dob);
    age = today.getFullYear() - birth.getFullYear();
    if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
  }

  var update = {
    full_name:          name,
    date_of_birth:      dob,
    age:                age,
    country:            country,
    phone_prefix:       prefix,
    phone:              phone,
    trading_experience: exp,
    bio:                bio
  };
  sb.from('profiles').update(update).eq('id', cUser.id).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    cProfile = Object.assign(cProfile || {}, update);
    document.getElementById('uname').textContent = (name || '').split(' ')[0] || 'Alumno';
    tst('✓ Perfil actualizado');
    rPerfil();
  });
}

function savePw() {
  var pw1 = document.getElementById('pf-pw1').value;
  var pw2 = document.getElementById('pf-pw2').value;
  if (!pw1) return tst('Ingresa una contraseña', 1);
  if (pw1.length < 6) return tst('Mínimo 6 caracteres', 1);
  if (pw1 !== pw2) return tst('Las contraseñas no coinciden', 1);
  sb.auth.updateUser({ password: pw1 }).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Contraseña actualizada');
    document.getElementById('pf-pw1').value = '';
    document.getElementById('pf-pw2').value = '';
  });
}

function saveEmail() {

async function uploadAvatar(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 3 * 1024 * 1024) return tst('Imagen máximo 3MB', 1);

  // Show uploading state
  var wrap = document.getElementById('avatar-wrap');
  if (wrap) wrap.style.opacity = '0.5';
  tst('Subiendo foto...');

  // Compress image before upload using canvas
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function(e) {
    img.onload = async function() {
      // Resize to max 400x400
      var canvas = document.createElement('canvas');
      var MAX = 400;
      var w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
      else        { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      canvas.toBlob(async function(blob) {
        var path = cUser.id + '/avatar.jpg';

        // Upload to Storage
        var up = await sb.storage.from('avatars').upload(path, blob, {
          contentType: 'image/jpeg',
          upsert: true
        });

        if (up.error) {
          if (wrap) wrap.style.opacity = '1';
          return tst('Error al subir: ' + up.error.message, 1);
        }

        // Get public URL
        var publicUrl = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
        // Add cache buster so browser doesn't show old photo
        publicUrl = publicUrl + '?t=' + Date.now();

        // Save URL to profile (tiny string, not base64)
        var upd = await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', cUser.id);
        if (upd.error) {
          if (wrap) wrap.style.opacity = '1';
          return tst('Error al guardar: ' + upd.error.message, 1);
        }

        cProfile.avatar_url = publicUrl;
        if (wrap) wrap.style.opacity = '1';
        tst('✓ Foto actualizada');
        rPerfil();
      }, 'image/jpeg', 0.85);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function _staffCan(key) {
  // Admin siempre puede todo. Staff depende de la config de staff_permissions.
  if (!cProfile || cProfile.role !== 'staff') return true;
  return !!(window._staffPerms && window._staffPerms[key]);
}

// ── Acceso a "profiles" para staff: pasa por el endpoint seguro (evita RLS
// directo sobre profiles, que causa recursión). Admin sigue usando Supabase
// directo, como siempre — sin cambios para esa cuenta.
async function _authHeader() {
  var session = await sb.auth.getSession();
  var token = session && session.data && session.data.session ? session.data.session.access_token : '';
  return { Authorization: 'Bearer ' + token };
}

function _fetchWithTimeout(url, opts, ms) {
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, ms || 35000);
  opts = opts || {};
  opts.signal = controller.signal;
  return fetch(url, opts).finally(function(){ clearTimeout(timer); });
}

async function _fetchAllStudents() {
  if (cProfile && cProfile.role === 'staff') {
    try {
      var headers = await _authHeader();
      var res = await _fetchWithTimeout('/api/staff-profiles', { headers: headers });
      var json = await res.json().catch(function(){ return {}; });
      if (!res.ok) { tst('Error al cargar alumnos: ' + (json.error||res.status), 1); return []; }
      return json.data || [];
    } catch (e) {
      tst(e.name === 'AbortError' ? 'La carga tardó demasiado — intenta de nuevo' : 'Error de conexión al cargar alumnos', 1);
      return [];
    }
  }
  var r = await sb.from('profiles').select('id, full_name, email, role, plan, live_plan, live_end, membership_start, membership_end, avatar_url, created_at, discord_id').order('created_at',{ascending:false});
  return r.data || [];
}

async function _fetchStudent(id) {
  if (cProfile && cProfile.role === 'staff') {
    try {
      var headers = await _authHeader();
      var res = await _fetchWithTimeout('/api/staff-profiles?id=' + id, { headers: headers });
      var json = await res.json().catch(function(){ return {}; });
      if (!res.ok) { tst('Error: ' + (json.error||res.status), 1); return null; }
      return json.data;
    } catch (e) {
      tst(e.name === 'AbortError' ? 'La carga tardó demasiado — intenta de nuevo' : 'Error de conexión', 1);
      return null;
    }
  }
  var r = await sb.from('profiles').select('id, full_name, email, role, age, date_of_birth, country, phone, phone_prefix, trading_experience, bio, membership_start, membership_end, avatar_url, plan, live_plan, live_end, roadmap_mode, access_1on1').eq('id', id).single();
  return r.data;
}

async function _updateStudent(id, data) {
  if (cProfile && cProfile.role === 'staff') {
    try {
      var headers = await _authHeader();
      headers['Content-Type'] = 'application/json';
      var res = await _fetchWithTimeout('/api/staff-profiles?id=' + id, { method: 'PATCH', headers: headers, body: JSON.stringify(data) });
      var json = await res.json().catch(function(){ return {}; });
      return { error: res.ok ? null : { message: json.error || res.status } };
    } catch (e) {
      return { error: { message: e.name === 'AbortError' ? 'timeout' : 'connection_error' } };
    }
  }
  return await sb.from('profiles').update(data).eq('id', id);
}

async function _deleteStudent(id) {
  if (cProfile && cProfile.role === 'staff') {
    try {
      var headers = await _authHeader();
      var res = await _fetchWithTimeout('/api/staff-profiles?id=' + id, { method: 'DELETE', headers: headers });
      var json = await res.json().catch(function(){ return {}; });
      return { error: res.ok ? null : { message: json.error || res.status } };
    } catch (e) {
      return { error: { message: e.name === 'AbortError' ? 'timeout' : 'connection_error' } };
    }
  }
  return await sb.from('profiles').delete().eq('id', id);
}

  var m = document.getElementById('amain');
  var tabs = document.createElement('div');
  tabs.className = 'admtabs-wrap';
  tabs.style.cssText = 'display:flex;gap:7px;margin-bottom:18px;overflow-x:auto;overflow-y:hidden;padding:6px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pinch-zoom;overscroll-behavior-x:contain;overscroll-behavior-y:none;flex-wrap:nowrap;-ms-overflow-style:none;position:sticky;top:61px;z-index:9;background:linear-gradient(180deg,var(--c-bg) 92%,transparent);margin-left:-18px;margin-right:-18px;';

  var allTabs = [
    ['st','Alumnos','access_students'],
    ['1on1','Reuniones 1-1','access_students'],
    ['codes','Planes', ['access_plans','access_discord','access_codes']],
    ['roadmap','Roadmap','access_roadmap'],
    ['ads','Anuncios','__admin_only'],
    ['apar','Apariencia','__admin_only']
  ];
  var visibleTabs = allTabs.filter(function(item) {
    var perm = item[2];
    if (Array.isArray(perm)) return perm.some(function(k){ return _staffCan(k); });

  if (!visibleTabs.length) {
    m.innerHTML += '<p style="color:var(--c-muted);font-size:.86rem;padding:20px 0;">Tu cuenta de Staff no tiene ningún permiso habilitado todavía. Pídele al admin que te active alguno en Planes → Permisos de Staff.</p>';
    return;
  }

  visibleTabs.forEach(function(item, i) {
    var btn = document.createElement('button');
    btn.className = 'admtab' + (i===0?' on':'');
    btn.textContent = item[1];
    btn.addEventListener('click', function(){ swA(btn, item[0]); });
    tabs.appendChild(btn);
  });
  m.appendChild(tabs);
  visibleTabs.forEach(function(item, i) {
    var div = document.createElement('div');
    div.id = 'a-'+item[0];

// "Hoy · 8:00 PM", "Mañana · 3:00 PM", "Jue 16 · 3:00 PM"
function _mkWhen(iso) {
  var d = new Date(iso), t0 = new Date(); t0.setHours(0,0,0,0);
  var d0 = new Date(d); d0.setHours(0,0,0,0);
  var diff = Math.round((d0 - t0) / 86400000);
  var day = diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }).replace('.', '');
  day = day.charAt(0).toUpperCase() + day.slice(1);
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  return day + ' · ' + ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
}
// CDN de la librería de Bunny Stream (Bunny → Stream → tu librería → API → "CDN Hostname").
// Sin esto Bunny no permite armar la miniatura a partir del video.
var MK_BUNNY_CDN = 'vz-a235fbc4-289.b-cdn.net';
function _mkThumb(l) {
  if (l && l.thumbnail_url) return l.thumbnail_url;
  var u = (l && l.video_url) || '', id = '';
  // Bunny primero: sus links también traen "embed/" y no son de YouTube
  if (u.indexOf('mediadelivery.net') !== -1 || u.indexOf('bunny.net') !== -1) {
    var p = u.split('?')[0].split('/'), vid = p[p.length - 1];
    return (MK_BUNNY_CDN && vid) ? 'https://' + MK_BUNNY_CDN + '/' + vid + '/thumbnail.jpg' : '';
  }
  if (u.indexOf('youtube.com/embed/') > -1) id = u.split('embed/')[1].split('?')[0];
  else if (u.indexOf('watch?v=') > -1) id = u.split('watch?v=')[1].split('&')[0];
  else if (u.indexOf('youtu.be/') > -1) id = u.split('youtu.be/')[1].split('?')[0];
  if (id) return 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg';
  return '';
}

function _mkApplyThemeCss(css, previewOnly) {
  var el = document.getElementById('mk-custom-theme');
  if (!css) { if (el) el.remove(); try { localStorage.removeItem('mk-theme-css'); } catch (e) {} return; }
  if (!el) { el = document.createElement('style'); el.id = 'mk-custom-theme'; document.head.appendChild(el); }
  el.textContent = css;
  if (!previewOnly) { try { localStorage.setItem('mk-theme-css', css); } catch (e) {} }
}
function _mkLoadSiteTheme() {
  sb.from('site_settings').select('theme').eq('id', 1).maybeSingle().then(function(r) {
    if (r.error) return; // la tabla aún no existe: se usan los colores originales
    window._mkSiteTheme = (r.data && r.data.theme) || null;
    _mkApplyThemeCss(window._mkSiteTheme ? _mkThemeCss(window._mkSiteTheme) : '');
  });
}

    '<div style="display:flex;gap:14px;flex-wrap:wrap;">' + col('dark','Modo Dark') + col('light','Modo Light') + '</div>' +

      '<button class="abtn2" id="apar-save">Guardar</button>' +

  c.querySelectorAll('input[type=color]').forEach(function(inp) {

      cur[inp.dataset.t][inp.dataset.k] = inp.value;

    });
  });

// ── PLANES: caché compartida (planes + sus variantes) ──
function _loadPlansCache(cb) {
  Promise.all([
    sb.from('checkout_plans').select('*').order('sort_order'),
    sb.from('checkout_plan_variants').select('*').order('sort_order')
  ]).then(function(results) {
    var plans = results[0].data || [];
    var variants = results[1].data || [];
    plans.forEach(function(p) {
      p.variants = variants.filter(function(v) { return v.plan_id === p.id; });
    });
    window._allPlans = plans;
    if (cb) cb(plans);
  });
}
function _planById(id) {
  return (window._allPlans || []).find(function(p) { return p.id === id; });
}

// "Ilimitado" se guarda como una fecha muy lejana (no null), para que todas las
// comparaciones de fecha que ya existen en la app (>) sigan funcionando sin
// tener que agregar casos especiales por todos lados.
var UNLIMITED_ISO = '2099-12-31T00:00:00.000Z';
function _isUnlimitedDate(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr).getFullYear() >= 2098;
}
function _fmtExpiry(dateStr) {
  if (!dateStr) return '—';
  if (_isUnlimitedDate(dateStr)) return 'Ilimitado';
  return new Date(dateStr).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}

function rAdmSt() {

function _renderStudents(data, showAll) {
    var t = document.getElementById('st-t'); if(!t) return;
    var q = (document.getElementById('st-search')||{}).value||'';
    if(!data||!data.length){t.innerHTML='<p style="color:var(--c-muted);padding:14px 0;font-size:.82rem;">'+(q?'Sin resultados para "'+q+'"':'Sin alumnos.')+'</p>';return;}
    var today = new Date();
    var visible = (showAll || q) ? data : data.slice(0, 5);
    var planBadge = function(s) {
      if (s.role === 'admin') return '<span style="padding:2px 8px;font-size:.68rem;font-weight:600;background:rgba(var(--c-acc),.14);color:var(--sl);border-radius:4px;">admin</span>';
      var plan = s.plan || '';
      var planDef = _planById(plan);
      var label = planDef ? (planDef.label || planDef.name) : (plan || '—');
      var color = planDef && planDef.color ? planDef.color : 'var(--c-text2)';
      var bg = planDef && planDef.color ? planDef.color + '1a' : 'rgba(var(--c-ov),.05)'; // color + alpha aprox
      return '<span style="padding:2px 8px;font-size:.68rem;font-weight:600;background:'+bg+';color:'+color+';border-radius:4px;" title="Administrar desde la ficha del alumno">'+label+'</span>';
    };
    t.innerHTML = '<div class="dtab-wrap"><table class="dtab"><thead><tr><th colspan="2">Alumno</th><th>Plan</th><th>Vence</th><th>Discord</th><th>Acción</th></tr></thead><tbody>'+
      visible.map(function(s){
        var en=s.membership_end?new Date(s.membership_end):null, act=en&&en>today;
        var liveEn=s.live_end?new Date(s.live_end):null, liveAct=liveEn&&liveEn>today;
        var liveTag = liveAct ? '<span title="Live vence '+liveEn.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})+' — administrar desde la ficha del alumno" style="padding:2px 7px;font-size:.66rem;font-weight:600;background:rgba(var(--c-ok),.1);color:rgb(var(--c-ok));border-radius:4px;margin-left:4px;">live ✓</span>' : '';
        var avatarHtml = s.avatar_url
          ? '<img src="'+s.avatar_url+'" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;">'
          : '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--st),var(--sl));display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;">'+((s.full_name||'?')[0].toUpperCase())+'</div>';
        return '<tr style="cursor:pointer;" onclick="viewStudentProfile(\''+s.id+'\')">'+
          '<td style="width:44px;min-width:44px;max-width:44px;padding:9px 12px 9px 6px;" onclick="viewStudentProfile(\''+s.id+'\')">'+avatarHtml+'</td>'+
          '<td style="max-width:220px;"><div style="color:var(--c-text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+_mkEsc(s.full_name||'Sin nombre')+'</div><div style="color:var(--c-muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+_mkEsc(s.email||'')+'</div></td>'+
          '<td style="white-space:nowrap;" onclick="event.stopPropagation()">'+planBadge(s)+liveTag+'</td>'+
          '<td style="white-space:nowrap;color:'+(act?'var(--c-text)':'rgb(var(--c-bad))')+';">'+(!en?'—':(en.getFullYear()>=2099?'Ilimitado':(act?en.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}):'Vencido')))+'</td>'+
          '<td>'+(s.discord_id===undefined?'<span style="color:var(--c-muted);">—</span>':'<span class="mk-pill '+(s.discord_id?'g':'')+'" style="font-size:.6rem;">'+(s.discord_id?'Sí':'No')+'</span>')+'</td>'+
          '<td><span class="mk-chip">'+(act?'Ver ficha':'Renovar')+'</span></td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>'+
      (!q && data.length > 5 && !showAll ? '<div style="text-align:center;margin-top:12px;"><button onclick="_renderStudents(window._allStudents, true)" style="background:rgba(var(--c-acc),.1);border:1px solid rgba(var(--c-acc),.2);color:var(--sl);padding:7px 20px;border-radius:6px;font-size:.78rem;cursor:pointer;">Ver todos ('+data.length+')</button></div>' : '');
}

function filterStudents(query) {
  var q = (query||'').toLowerCase();
  var filtered = (window._allStudents||[]).filter(function(s) {
    return !q || (s.full_name||'').toLowerCase().indexOf(q) >= 0 || (s.email||'').toLowerCase().indexOf(q) >= 0;
  });
  _renderStudents(filtered);
}

// Admin roadmap editor
function rAdmRoadmap() {
  var c = document.getElementById('a-roadmap'); if (!c) return;
  c.innerHTML = '<div style="font-size:.86rem;font-weight:600;margin-bottom:14px;">📋 Roadmap semanal — haz clic en una semana para editarla</div><div id="roadmap-grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;"><span class="spin"></span></div>';
  sb.from('roadmap_weeks').select('*').order('week_number').then(function(r) {
    var existing = {};
    var maxWeek = 0;
    if (r.data) r.data.forEach(function(w) { existing[w.week_number] = w; if (w.week_number > maxWeek) maxWeek = w.week_number; });
    var grid = document.getElementById('roadmap-grid');
    if (!grid) return;
    grid.innerHTML = '';
    for (var i = 1; i <= maxWeek; i++) {
      var w = existing[i];
      var cell = document.createElement('div');
      cell.style.cssText = 'background:'+(w?'rgba(var(--c-acc),.12)':'rgba(var(--c-ov),.03)')+';border:1px solid '+(w?'rgba(var(--c-acc),.25)':'var(--br)')+';border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;transition:.15s;';
      cell.innerHTML =
        '<div style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:1.1rem;font-weight:800;color:'+(w?'var(--sl)':'var(--c-faint)')+';">'+i+'</div>' +
        '<div style="font-size:.6rem;color:var(--c-muted);margin-top:2px;">'+(w?'✓ Listo':'Vacía')+'</div>';
      cell.onmouseover = function(){ this.style.borderColor='var(--sl)'; };
      cell.onmouseout = function(){ this.style.borderColor=(this.dataset.has==='1'?'rgba(var(--c-acc),.25)':'var(--br)'); };
      if (w) cell.dataset.has = '1';
      (function(week, wData){ cell.addEventListener('click', function(){ editRoadmapWeek(week, wData); }); })(i, w);
      grid.appendChild(cell);
    }
    // Botón + para agregar siguiente semana
    var addCell = document.createElement('div');
    addCell.style.cssText = 'background:rgba(var(--c-ok),.05);border:1px dashed rgba(var(--c-ok),.25);border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;transition:.15s;';
    addCell.innerHTML = '<div style="font-size:1.4rem;color:rgba(var(--c-ok),.6);">+</div><div style="font-size:.6rem;color:var(--c-muted);margin-top:2px;">Semana '+(maxWeek+1)+'</div>';
    addCell.onmouseover = function(){ this.style.borderColor='rgba(var(--c-ok),.6)'; };
    addCell.onmouseout = function(){ this.style.borderColor='rgba(var(--c-ok),.25)'; };
    (function(nextWeek){ addCell.addEventListener('click', function(){ editRoadmapWeek(nextWeek, null); }); })(maxWeek+1);
    grid.appendChild(addCell);
  });
}

function editRoadmapWeek(weekNum, existing) {
  var acts = existing && Array.isArray(existing.activities) ? existing.activities : (existing ? JSON.parse(existing.activities||'[]') : []);
  var ov = document.createElement('div');
  ov.id = 'roadmap-week-modal';
  _injectWhopStyles();
  ov.className = 'wp-overlay';
  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };
  var box = document.createElement('div');
  box.className = 'wp-modal';
  box.style.maxWidth = '520px';
  box.style.overflowY = 'auto';
  box.innerHTML =
    '<div class="wp-header" style="padding:20px 24px 4px;">' +
      '<div class="wp-title" style="flex:1;font-size:1.05rem;">Editar Semana '+weekNum+'</div>' +
      '<button onclick="this.closest(\'.wp-overlay\').remove()" style="background:none;border:none;color:var(--c-muted);font-size:1.3rem;cursor:pointer;">✕</button>' +
    '</div>' +
    '<div class="wp-body" style="padding:12px 24px 24px;">' +
      '<div class="wp-field"><label class="wp-label">Título de la semana</label><input id="rw-title" class="wp-input" value="'+(existing?existing.title:'')+'" placeholder="Ej: Fundamentos del mercado"></div>' +
      '<div class="wp-field"><label class="wp-label">Objetivo</label><textarea id="rw-obj" class="wp-input" rows="2" style="width:100%;box-sizing:border-box;resize:vertical;" placeholder="¿Qué debe lograr el alumno esta semana?">'+(existing?existing.objective:'')+'</textarea></div>' +
      '<div class="wp-field">' +
        '<label class="wp-label">Actividades (una por línea)</label>' +
        '<textarea id="rw-acts" class="wp-input" rows="5" style="width:100%;box-sizing:border-box;resize:vertical;" placeholder="Actividad 1&#10;Actividad 2&#10;Tarea: ...">' + acts.join('\n') + '</textarea>' +
      '</div>' +
      '<div class="wp-footer" style="margin-top:6px;">' +
        '<button onclick="saveRoadmapWeek('+weekNum+')" class="wp-btn-primary">Guardar semana</button>' +
        (existing ? '<button onclick="deleteRoadmapWeek('+weekNum+')" class="wp-btn-danger">Eliminar</button>' : '') +
      '</div>' +
    '</div>';
  ov.appendChild(box);
  document.body.appendChild(ov);
}

function saveRoadmapWeek(weekNum) {
  var title = document.getElementById('rw-title').value.trim();
  var obj = document.getElementById('rw-obj').value.trim();
  var actsRaw = document.getElementById('rw-acts').value.trim();
  var acts = actsRaw ? actsRaw.split('\n').map(function(a){return a.trim();}).filter(Boolean) : [];
  if (!title) return tst('El título es requerido', 1);
  sb.from('roadmap_weeks').upsert({
    week_number: weekNum, title: title, objective: obj, activities: JSON.stringify(acts)
  }, { onConflict: 'week_number' }).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Semana ' + weekNum + ' guardada');
    var ov = document.getElementById('roadmap-week-modal'); if (ov) ov.remove();
    rAdmRoadmap();
  });
}

function deleteRoadmapWeek(weekNum) {
  if (!confirm('¿Eliminar el contenido de la semana ' + weekNum + '?')) return;
  sb.from('roadmap_weeks').delete().eq('week_number', weekNum).then(function(r) {
    if (r.error) return tst('Error', 1);
    tst('✓ Semana eliminada');
    var ov = document.getElementById('roadmap-week-modal'); if (ov) ov.remove();
    rAdmRoadmap();
  });
}

// Próximas / Pasadas (con asistencia y estado) / Grabaciones en una sola vista
var _a1Tab = 'up';
// Desde esta fecha, las reuniones dentro de la app se marcan solas según si el alumno entró
var MTG_AUTO_FROM = new Date('2026-10-12T00:00:00Z');
function _mtgInApp(m) { return !m.meet_url; }
function _mtgDone(m) { return new Date(m.scheduled_at) < new Date(Date.now() - 1800000); }

function rAdm1on1() {
  var c = document.getElementById('a-1on1'); if (!c) return;
  _injectWhopStyles();
  c.innerHTML =
    '<div class="wp-subtabs a1-tabs">' +
      '<button class="wp-subtab-btn" data-a1="up">Próximas <i id="a1-n-up"></i></button>' +
      '<button class="wp-subtab-btn" data-a1="past">Pasadas <i id="a1-n-past"></i></button>' +
      '<button class="wp-subtab-btn" data-a1="rec">Grabaciones</button>' +
    '</div>' +
    '<div class="a1-head">' +
      '<input class="a1-q" id="a1-q" placeholder="Buscar alumno...">' +
      '<button class="mk-btn" onclick="openSchModal()">+ Programar reunión</button>' +
    '</div>' +
    '<div id="a1on1-list"></div>' +
    '<div id="a1on1-rec" style="display:none;"></div>';
  c.querySelectorAll('[data-a1]').forEach(function(b) { b.addEventListener('click', function() { swA1on1(b.dataset.a1); }); });
  document.getElementById('a1-q').addEventListener('input', function() { _a1Shown = 5; _rA1List(); });
  swA1on1(_a1Tab === 'rec' ? 'up' : _a1Tab);
}

function swA1on1(tab) {
  _a1Tab = tab;
  document.querySelectorAll('[data-a1]').forEach(function(b) { b.classList.toggle('active', b.dataset.a1 === tab); });
  _tabInk(document.querySelector('.a1-tabs'));
  _a1Shown = 5;
  var l = document.getElementById('a1on1-list'), r = document.getElementById('a1on1-rec'), q = document.getElementById('a1-q');
  if (l) l.style.display = tab === 'rec' ? 'none' : '';
  if (r) r.style.display = tab === 'rec' ? '' : 'none';
  if (q) q.style.display = tab === 'rec' ? 'none' : '';
  _tabFx(tab === 'rec' ? r : l);
  if (tab === 'rec') _rAdm1on1Rec(); else _rAdm1on1Load();
}
function _rAdm1on1Refresh() { if (_a1Tab === 'rec') _rAdm1on1Rec(); else _rAdm1on1Load(); }
function _rAdm1on1Mtg() { _rAdm1on1Load(); }

var _a1Data = [];
var _a1Shown = 5; // se muestran de 5 en 5 ("Ver más")
function _rAdm1on1Load() {
  var el = document.getElementById('a1on1-list'); if (!el) return;
  if (!_a1Data.length) el.innerHTML = '<div class="mk-card" style="text-align:center;padding:40px;"><span class="spin"></span></div>';
  sb.from('meetings_1on1').select('*, profiles(full_name, avatar_url)').order('scheduled_at', { ascending: false }).limit(300).then(function(r) {
    if (r.error) { el.innerHTML = '<div class="mk-empty">Error: ' + _mkEsc(r.error.message) + '</div>'; return; }
    _a1Data = r.data || [];
    // Marca automática: reuniones dentro de la app que ya pasaron y nadie revisó
    var auto = _a1Data.filter(function(m) {
      return _mtgDone(m) && _mtgInApp(m) && (!m.status || m.status === 'scheduled') && ('student_joined_at' in m) && new Date(m.scheduled_at) >= MTG_AUTO_FROM;
    });
    auto.forEach(function(m) {
      m.status = m.student_joined_at ? 'completed' : 'no_show'; m._auto = true;
      sb.from('meetings_1on1').update({ status: m.status }).eq('id', m.id).then(function(){});
    });
    _rA1List();
  });
}

function _a1Av(name) {
  var ini = String(name || '?').split(' ').map(function(w){ return w[0] || ''; }).slice(0, 2).join('').toUpperCase();
  return '<span class="a1-av">' + _mkEsc(ini) + '</span>';
}
var _A1_ST = { completed: ['Completada', 'g'], no_show: ['No asistió', 'r'], cancelled: ['Cancelada', 'n'], scheduled: ['Sin revisar', 'w'] };

function _rA1List() {
  var el = document.getElementById('a1on1-list'); if (!el) return;
  var q = ((document.getElementById('a1-q') || {}).value || '').toLowerCase().trim();
  var up = [], past = [];
  _a1Data.forEach(function(m) { (_mtgDone(m) ? past : up).push(m); });
  up.reverse();
  var pend = past.filter(function(m){ return !m.status || m.status === 'scheduled'; }).length;
  var nu = document.getElementById('a1-n-up'); if (nu) nu.textContent = up.length || '';
  var np = document.getElementById('a1-n-past'); if (np) { np.textContent = pend || ''; np.className = pend ? 'warn' : ''; }
  var rows = (_a1Tab === 'past' ? past : up).filter(function(m) {
    return !q || ((m.profiles && m.profiles.full_name) || '').toLowerCase().indexOf(q) > -1 || (m.title || '').toLowerCase().indexOf(q) > -1;
  });
  if (!rows.length) {
    el.innerHTML = '<div class="mk-card a1-empty">' + (q ? 'Sin resultados para "' + _mkEsc(q) + '".' : _a1Tab === 'past' ? 'Aún no hay reuniones pasadas.' : 'No hay reuniones próximas. Usa "+ Programar reunión" para agendar una.') + '</div>';
    return;
  }
  var isPast = _a1Tab === 'past';
  var total = rows.length;
  rows = rows.slice(0, _a1Shown);
  var ico = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  var del = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  var html = '<div class="mk-card mk-tbl-wrap"><table class="mk-tbl a1-tbl"><thead><tr><th>Alumno</th><th>Tema</th><th>Fecha</th><th>Llamada</th><th>' + (isPast ? 'Asistencia' : 'Empieza') + '</th>' + (isPast ? '<th>Estado</th>' : '') + '<th></th></tr></thead><tbody>';
  rows.forEach(function(m) {
    var d = new Date(m.scheduled_at), name = (m.profiles && m.profiles.full_name) || 'Alumno';
    var inApp = _mtgInApp(m);
    var call = inApp ? '<span class="mk-pill">En la app</span>' : '<a class="mk-pill b" href="' + _mkEsc(_mkSafeUrl(m.meet_url)) + '" target="_blank" rel="noopener">Link externo ↗</a>';
    var fecha = d.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    var col5, col6 = '', act;
    if (isPast) {
      if (!inApp) col5 = '<span class="a1-mut">Fuera de la app</span>';
      else if (m.student_joined_at) col5 = '<span class="a1-ok">● Entró ' + new Date(m.student_joined_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</span>';
      else col5 = '<span class="a1-mut">○ No entró</span>';
      var st = _A1_ST[m.status] ? m.status : 'scheduled';
      col6 = '<td><select class="a1-st ' + _A1_ST[st][1] + '" data-id="' + _mkEsc(m.id) + '">' +
        ['scheduled', 'completed', 'no_show', 'cancelled'].map(function(k) { return '<option value="' + k + '"' + (k === st ? ' selected' : '') + '>' + _A1_ST[k][0] + '</option>'; }).join('') +
        '</select>' + (m._auto ? '<div class="a1-auto">marcada sola</div>' : '') + '</td>';
    } else {
      var df = d - new Date(), D = Math.floor(df / 86400000), H = Math.floor(df % 86400000 / 3600000), M = Math.max(0, Math.floor(df % 3600000 / 60000));
      col5 = df <= 0 ? '<span class="a1-ok">● Ahora</span>' : '<span class="' + (df < 3600000 ? 'a1-soon' : 'a1-mut') + '">en ' + (D > 0 ? D + 'd ' + H + 'h' : H > 0 ? H + 'h ' + M + 'm' : M + ' min') + '</span>';
    }
    act = '<div class="a1-act">' +
      (!isPast ? (inApp ? '<button class="mk-chip" data-a1join="' + _mkEsc(m.id) + '" data-t="' + _mkEsc(m.title || 'Sesión 1-1') + '" data-n="' + _mkEsc(name) + '">Entrar</button>' : '') : '') +
      '<button class="a1-ic" title="Editar" onclick="openEditMtgModal(\'' + m.id + '\',\'' + encodeURIComponent(m.title || 'Sesión 1-1') + '\',\'' + encodeURIComponent(m.meet_url || '') + '\',\'' + m.scheduled_at + '\')">' + ico + '</button>' +
      '<button class="a1-ic del" title="Eliminar" onclick="delAdmMtg(\'' + m.id + '\')">' + del + '</button></div>';
    html += '<tr><td><div class="a1-who">' + _a1Av(name) + '<b>' + _mkEsc(name) + '</b></div></td><td class="a1-t">' + _mkEsc(m.title || 'Sesión 1-1') + '</td><td class="a1-d">' + fecha + '</td><td>' + call + '</td><td>' + col5 + '</td>' + col6 + '<td>' + act + '</td></tr>';
  });
  html += '</tbody></table></div>';
  if (total > rows.length) html += '<div class="a1-more"><button class="mk-btn ghost" id="a1-more">Ver ' + Math.min(5, total - rows.length) + ' más</button><span>Mostrando ' + rows.length + ' de ' + total + '</span></div>';
  if (isPast) html += '<div class="a1-note">Las reuniones dentro de la app se marcan solas: Completada si el alumno entró y No asistió si no entró. Puedes cambiar el estado cuando quieras.</div>';
  el.innerHTML = html;
  var mb = document.getElementById('a1-more');
  if (mb) mb.addEventListener('click', function() { _a1Shown += 5; _rA1List(); });
  el.querySelectorAll('.a1-st').forEach(function(s) {
    s.addEventListener('change', function() { setMtgStatus(s.dataset.id, s.value); });
  });
  el.querySelectorAll('[data-a1join]').forEach(function(b) {
    b.addEventListener('click', function() { _lvJoinRoom(b.dataset.a1join, b.dataset.t + ' · ' + b.dataset.n, { meeting: true }); });
  });
}

function setMtgStatus(id, st) {
  sb.from('meetings_1on1').update({ status: st }).eq('id', id).then(function(r) {
    if (r.error) { tst('No se pudo guardar el estado: ' + r.error.message, 1); return _rAdm1on1Load(); }
    var m = _a1Data.find(function(x){ return String(x.id) === String(id); }); if (m) { m.status = st; m._auto = false; }
    tst('✓ Estado guardado');
    _rA1List();
  });
}

// ── MODAL PROGRAMAR REUNIÓN ──

  if (existing) existing.remove();

  var ov = document.createElement('div');
  ov.id = 'sch-modal';
  _injectWhopStyles();
  ov.className = 'wp-overlay';
  ov.innerHTML =
    '<div class="wp-modal" style="max-width:480px;display:flex;flex-direction:column;overflow:hidden;">' +
      // Header

        '<div style="flex:1;"><div class="wp-title" style="font-size:1rem;">Programar reunión 1-1</div><div class="wp-subtitle" id="sch-modal-subtitle">Selecciona un alumno</div></div>' +

      '<div id="sch-step2" style="display:none;padding:18px 24px 24px;overflow-y:auto;">' +

          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg> Cambiar alumno' +

        '<div id="sch-selected-student" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(var(--c-acc),.08);border:1px solid rgba(var(--c-acc),.2);border-radius:12px;margin-bottom:16px;"></div>' +
        '<div class="wp-field"><label class="wp-label">Título</label><input id="sch-m-title" class="wp-input" placeholder="Sesión 1-1 · Semana X" value="Sesión 1-1"></div>' +
        '<div class="wp-field wp-grid2">' +
          '<div><label class="wp-label">Fecha</label><input type="date" id="sch-m-date" class="wp-input"></div>' +
          '<div><label class="wp-label">Hora</label><input type="time" id="sch-m-time" class="wp-input"></div>' +
        '</div>' +
        _mtgWhereHtml('sch-m', '') +
        '<button id="sch-m-save" class="wp-btn-primary" onclick="saveSchModal()" style="width:100%;">Programar sesión</button>' +
      '</div>' +

  document.body.appendChild(ov);

  // Load students

    window._schModalStudents = students || [];
    _renderSchModalList(window._schModalStudents);

function _renderSchModalList(students) {
  var listEl = document.getElementById('sch-modal-list'); if (!listEl) return;
  if (!students.length) { listEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--c-muted);font-size:.8rem;">Sin resultados</div>'; return; }
  listEl.innerHTML = students.map(function(s) {
    var initials = (s.full_name||'?').split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();
    var active = s.membership_end && new Date(s.membership_end) > new Date();
    return '<div onclick="schSelectStudent(\'' + s.id + '\',\'' + encodeURIComponent(s.full_name||'Alumno') + '\',' + active + ')" ' +
      'style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;" ' +
      'onmouseover="this.style.background=\'rgba(var(--c-acc),.08)\';this.style.borderColor=\'rgba(var(--c-acc),.2)\'" ' +
      'onmouseout="this.style.background=\'transparent\';this.style.borderColor=\'transparent\'">' +
      '<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--st),var(--sl));display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff;flex-shrink:0;">' + initials + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:.85rem;font-weight:600;color:var(--c-text);">' + (s.full_name||'Sin nombre') + '</div>' +
        '<div style="font-size:.68rem;margin-top:1px;color:' + (active?'rgb(var(--c-ok))':'var(--c-muted)') + ';">' + (active?'● Activo':'○ Inactivo') + '</div>' +
      '</div>' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>' +
    '</div>';
  }).join('');
}

function filterSchModal(q) {
  var term = (q||'').toLowerCase().trim();
  var all = window._schModalStudents || [];
  _renderSchModalList(term ? all.filter(function(s){ return (s.full_name||'').toLowerCase().indexOf(term) !== -1; }) : all);
}

function schSelectStudent(id, encName, active) {
  window._schSelectedId = id;
  var name = decodeURIComponent(encName);
  var initials = name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();

  var sel = document.getElementById('sch-selected-student');
  if (sel) sel.innerHTML =
    '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--st),var(--sl));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;">' + initials + '</div>' +
    '<div><div style="font-size:.85rem;font-weight:600;color:var(--c-text);">' + name + '</div>' +
    '<div style="font-size:.68rem;margin-top:1px;color:' + (active?'rgb(var(--c-ok))':'var(--c-muted)') + ';">' + (active?'● Activo':'○ Inactivo') + '</div></div>';

  document.getElementById('sch-step1').style.display = 'none';
  document.getElementById('sch-step2').style.display = 'block';
  var sub = document.getElementById('sch-modal-subtitle');
  if (sub) sub.textContent = name;
  setTimeout(function(){ var d = document.getElementById('sch-m-date'); if(d) d.focus(); }, 50);
}

function schBack() {
  document.getElementById('sch-step2').style.display = 'none';
  document.getElementById('sch-step1').style.display = 'flex';
  var sub = document.getElementById('sch-modal-subtitle');
  if (sub) sub.textContent = 'Selecciona un alumno';
}

function saveSchModal() {
  var studentId = window._schSelectedId;
  if (!studentId) return tst('Selecciona un alumno', 1);
  var title = (document.getElementById('sch-m-title')||{}).value || 'Sesión 1-1';
  var date  = (document.getElementById('sch-m-date') ||{}).value || '';
  var time  = (document.getElementById('sch-m-time') ||{}).value || '00:00';
  var url   = _mtgWhereUrl('sch-m-url');
  if (!date) return tst('Selecciona una fecha', 1);
  var btn = document.getElementById('sch-m-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }
  sb.from('meetings_1on1').insert({
    student_id:   studentId,
    scheduled_at: new Date(date + 'T' + time).toISOString(),
    title:        title.trim() || 'Sesión 1-1',
    meet_url:     url.trim() || null,
    status:       'scheduled'
  }).then(function(r) {
    if (r.error) { tst('Error: '+r.error.message,1); if(btn){btn.disabled=false;btn.textContent='Programar sesión';} return; }
    tst('✓ Sesión programada');
    var m = document.getElementById('sch-modal');
    if (m) m.remove();
    // Refresh meetings tab if visible
    _rAdm1on1Refresh();
  });
}

// Campo "Dónde": llamada dentro de la app (sala privada) o link externo
function _mtgWhereHtml(pre, url) {
  var ext = !!url;
  return '<div class="wp-field"><label class="wp-label">Dónde será la llamada</label><div class="lv-seg mtg-where">' +
      '<button type="button" data-w="app"' + (ext ? '' : ' class="on"') + '>En la app</button>' +
      '<button type="button" data-w="ext"' + (ext ? ' class="on"' : '') + '>Link externo</button></div>' +
    '<div class="mtg-where-hint" style="font-size:.74rem;color:var(--c-muted);margin-top:8px;' + (ext ? 'display:none;' : '') + '">Sala privada: solo entran tú y este alumno, desde su pestaña Reuniones 1-1.</div>' +
    '<input id="' + pre + '-url" class="wp-input" style="margin-top:10px;' + (ext ? '' : 'display:none;') + '" value="' + _mkEsc(url || '') + '" placeholder="https://meet.google.com/...">' +
  '</div>';
}
function _mtgWhereBind(ov) {
  var seg = ov.querySelector('.mtg-where'); if (!seg) return;
  seg.querySelectorAll('button').forEach(function(b) {
    b.addEventListener('click', function() {
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
      var ext = b.dataset.w === 'ext', f = seg.parentNode;
      f.querySelector('.mtg-where-hint').style.display = ext ? 'none' : '';
      var inp = f.querySelector('input'); inp.style.display = ext ? '' : 'none'; if (ext) inp.focus();
    });
  });
}
function _mtgWhereUrl(id) {
  var inp = document.getElementById(id); if (!inp) return '';
  var on = inp.parentNode.querySelector('.mtg-where .on');
  return on && on.dataset.w === 'ext' ? inp.value.trim() : '';
}

function saveEditMtg(id) {
  var title = (document.getElementById('emtg-title')||{}).value || '';

function filterRecStudents(q) {
  var term = (q||'').toLowerCase().trim();
  var cards = document.querySelectorAll('.rec-stu-card');
  var any = false;
  cards.forEach(function(card) {
    var name = card.getAttribute('data-name') || '';
    var show = !term || name.indexOf(term) !== -1;
    card.style.display = show ? 'block' : 'none';
    if (show) any = true;
  });
  // Show/hide empty state
  var empty = document.getElementById('rec-stu-empty');
  if (!empty && !any) {
    var list = document.getElementById('rec-stu-list');
    if (list) {
      var d = document.createElement('div');
      d.id = 'rec-stu-empty';
      d.style.cssText = 'text-align:center;padding:20px;font-size:.8rem;color:var(--c-faint);';
      d.textContent = 'Sin resultados para "' + q + '"';
      list.appendChild(d);
    }
  } else if (empty && any) {
    empty.remove();
  } else if (empty && !any) {
    empty.textContent = 'Sin resultados para "' + q + '"';
  }
}

// Modal compartido: elige un plan/variante REAL (filtrado por categoría) y aplica
// exactamente su duración a Clases o a Live, según cuál toggle lo abrió.
function openAccessPickerModal(studentId, kind) {
  var isLive = kind === 'live';
  var existing = document.getElementById('access-picker-modal');
  if (existing) existing.remove();
  _injectWhopStyles();

  var opts = [];
  (window._allPlans || []).filter(function(p){ return p.active; }).forEach(function(p) {
    var relevant = isLive ? (p.category === 'live' || p.category === 'ambos') : (p.category === 'clases' || p.category === 'ambos');
    if (!relevant) return;
    if (p.variants && p.variants.length) {
      p.variants.forEach(function(v) {
        var dur = isLive ? v.duration_live_months : v.duration_clases_months;
        opts.push({ value: p.id + '|' + v.id, label: p.name + ' — ' + v.name, dur: dur });
      });
    } else {
      var dur = isLive ? p.duration_live_months : p.duration_clases_months;
      opts.push({ value: p.id + '|', label: p.name, dur: dur });
    }
  });

  var modal = document.createElement('div');
  modal.id = 'access-picker-modal';
  modal.className = 'wp-overlay';
  modal.style.zIndex = '10000';
  modal.innerHTML =
    '<div class="wp-modal" style="max-width:400px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+(isLive?MK_IC.live:MK_IC.book)+'</div>' +
        '<div class="wp-title" style="font-size:1rem;">Activar '+(isLive?'Live':'Clases')+'</div>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        (opts.length ?
          '<div class="wp-field"><label class="wp-label">Plan a asignar</label><select id="ap-sel" class="wp-input">' +
            opts.map(function(o){ return '<option value="'+o.value+'">'+o.label+(o.dur?' ('+o.dur+' meses)':' (ilimitado)')+'</option>'; }).join('') +
          '</select></div>'
        : '<div style="font-size:.8rem;color:var(--c-muted);">No hay planes activos de categoría "'+(isLive?'Live':'Clases')+'" — créalos primero en Gestión de Planes.</div>'
        ) +
        '<div class="wp-footer">' +
          (opts.length ? '<button id="ap-btn" class="wp-btn-primary">Activar</button>' : '') +
          '<button class="wp-btn-ghost" onclick="document.getElementById(\'access-picker-modal\').remove();var cb=document.getElementById(\''+(isLive?'stud-live-toggle':'stud-clases-toggle')+'\');if(cb)cb.checked=false;">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){
    if (e.target === modal) {
      modal.remove();
      var cb = document.getElementById(isLive ? 'stud-live-toggle' : 'stud-clases-toggle');
      if (cb) cb.checked = false;
    }
  });

  if (!opts.length) return;

  document.getElementById('ap-btn').addEventListener('click', function() {
    var val = document.getElementById('ap-sel').value.split('|');
    var planId = val[0];
    var variantId = val[1] || null;
    var chosen = opts.find(function(o){ return o.value === planId + '|' + (variantId||''); });
    var dur = chosen ? chosen.dur : null;
    var btn = this; btn.disabled = true; btn.textContent = 'Activando...';

    var upd = {};
    if (isLive) {
      upd.live_plan = planId;
      upd.live_end = dur ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+dur); return e.toISOString(); })() : UNLIMITED_ISO;
    } else {
      upd.plan = planId;
      upd.membership_start = new Date().toISOString();
      upd.membership_end = dur ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+dur); return e.toISOString(); })() : UNLIMITED_ISO;
      var planDef = _planById(planId);
      if (planDef) { upd.access_1on1 = !!planDef.access_1on1; upd.roadmap_mode = planDef.roadmap_mode; }
    }
    _updateStudent(studentId, upd).then(function(r) {
      modal.remove();
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('✓ ' + (isLive?'Live':'Clases') + ' activado');
      viewStudentProfile(studentId);
    });
  });
}

function loadStudentRoadmap(studentId, roadmapMode, membershipStart) {
  var container = document.getElementById('stud-roadmap-' + studentId);
  if (!container) return;

  var isMentoria = roadmapMode === 'manual';

  // Load roadmap weeks and progress together
  Promise.all([
    sb.from('roadmap_weeks').select('week_number, title').order('week_number'),
    sb.from('roadmap_progress').select('week_number, completed').eq('user_id', studentId)
  ]).then(function(results) {
    var weeks = results[0].data || [];
    var progress = results[1].data || [];
    var completedWeeks = {};
    progress.forEach(function(r) { if (r.completed) completedWeeks[r.week_number] = true; });

    // Calculate current week by time (for formacion-basico)
    var start = membershipStart ? new Date(membershipStart) : null;
    var timeWeek = start ? Math.max(1, Math.ceil((new Date() - start) / (7*86400000))) : 1;

    // For mentoria: current week = last completed week + 1
    var lastCompleted = 0;
    weeks.forEach(function(w) { if (completedWeeks[w.week_number]) lastCompleted = w.week_number; });
    var currentWeek = isMentoria ? (lastCompleted + 1) : timeWeek;

    var html = '<div style="font-size:.7rem;margin-bottom:10px;">' + (isMentoria ? '<span style="color:rgb(var(--c-acc));">● Avance manual</span>' : '<span style="color:var(--sl);">● Automático</span>') + '</div>';

    html += '<div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;">';
    weeks.forEach(function(w) {
      var isCompleted = completedWeeks[w.week_number];
      var isCurrent = w.week_number === currentWeek;
      var isLocked = w.week_number > currentWeek;

      html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:' +
        (isCompleted ? 'rgba(var(--c-ok),.06)' : isCurrent ? 'rgba(var(--c-acc),.1)' : 'rgba(var(--c-ov),.02)') +
        ';border:1px solid ' +
        (isCompleted ? 'rgba(var(--c-ok),.2)' : isCurrent ? 'rgba(var(--c-acc),.25)' : 'rgba(var(--c-ov),.04)') + ';">';

      if (isMentoria) {
        // Checkbox for mentoria
        html += '<input type="checkbox" ' + (isCompleted ? 'checked' : '') +
          ' onchange="toggleWeekComplete(\'' + studentId + '\',' + w.week_number + ',this.checked)" ' +
          'style="width:15px;height:15px;accent-color:rgb(var(--c-ok));cursor:pointer;flex-shrink:0;">';
      } else {
        // Status dot for formacion
        html += '<div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' +
          (isCompleted ? 'rgb(var(--c-ok))' : isCurrent ? 'var(--sl)' : 'rgba(var(--c-ov),.1)') + ';"></div>';
      }

      html += '<div style="flex:1;min-width:0;">' +
        '<span style="font-size:.72rem;font-weight:600;color:' +
        (isCompleted ? 'rgb(var(--c-ok))' : isCurrent ? 'var(--c-text)' : 'var(--c-muted)') + ';">Sem ' + w.week_number + '</span>' +
        '<span style="font-size:.7rem;color:var(--c-muted);margin-left:6px;">' + (w.title || '') + '</span>' +
        '</div>';

      if (isCurrent && !isCompleted) {
        html += '<span style="font-size:.6rem;color:rgb(var(--c-acc));font-weight:600;">▶ AQUÍ</span>';
      }

      html += '</div>';
    });
    html += '</div>';

    container.innerHTML = html;
  });
}

function toggleWeekComplete(studentId, weekNum, completed) {
  sb.from('roadmap_progress').upsert({
    user_id: studentId,
    week_number: weekNum,
    completed: completed,
    completed_at: completed ? new Date().toISOString() : null,
    completed_by: cUser.id
  }, { onConflict: 'user_id,week_number' }).then(function(r) {
    if (r.error) { tst('Error: ' + r.error.message, 1); return; }
    tst(completed ? '✓ Semana ' + weekNum + ' completada' : 'Semana ' + weekNum + ' desmarcada');
    // Reload roadmap in card
    loadStudentRoadmap(studentId, 'manual', null);
  });
}

function activateMember(id, isActive) {
  if (isActive) {
    if (!confirm('¿Desactivar membresía de este alumno?')) return;
    sb.from('profiles').update({ membership_end: new Date(Date.now() - 1000).toISOString() }).eq('id', id).then(function(r) {
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('Membresía desactivada');
      rAdmSt();
    });
    return;
  }

  // Mostrar modal para elegir plan
  if (!window._allPlans) { _loadPlansCache(function(){ activateMember(id, isActive); }); return; }
  var existing = document.getElementById('activate-modal');
  if (existing) existing.remove();

  var opts = [];
  (window._allPlans || []).filter(function(p){ return p.active; }).forEach(function(p) {
    if (p.variants && p.variants.length) {
      p.variants.forEach(function(v) {
        opts.push({
          value: p.id + '|' + v.id,
          label: (p.label || p.name) + ' — ' + v.name + ' ($' + Number(v.price).toLocaleString() + ')'
        });
      });
    } else {
      opts.push({ value: p.id + '|', label: p.name + ' ($' + Number(p.price).toLocaleString() + ')' });
    }
  });
  if (!opts.length) opts.push({ value: '|', label: 'Sin planes configurados — ve a Gestión de Planes' });

  var modal = document.createElement('div');
  modal.id = 'activate-modal';
  _injectWhopStyles();
  modal.className = 'wp-overlay';
  modal.innerHTML =
    '<div class="wp-modal" style="max-width:420px;">' +
      '<div class="wp-header" style="padding:22px 24px 4px;">' +
        '<div class="wp-header-icon" style="width:32px;height:32px;font-size:.95rem;">'+MK_IC.ticket+'</div>' +
        '<div><div class="wp-title" style="font-size:1rem;">Activar / Cambiar plan</div><div class="wp-subtitle">Asignación manual</div></div>' +
      '</div>' +
      '<div class="wp-body" style="padding:16px 24px 24px;">' +
        '<div class="wp-field"><label class="wp-label">Plan</label><select id="act-plan-sel" class="wp-input">' +
          opts.map(function(o){ return '<option value="'+o.value+'">'+o.label+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="wp-toggle-row">' +
          '<span class="wp-toggle-text">Mantener fechas actuales</span>' +
          '<label class="wp-toggle"><input type="checkbox" id="act-keep-dates" onchange="document.getElementById(\'act-manual-date-wrap\').style.display=this.checked?\'none\':\'\';"><span class="wp-toggle-track"></span></label>' +
        '</div>' +
        '<div id="act-manual-date-wrap" class="wp-field">' +
          '<label class="wp-label">Fecha de vencimiento manual (opcional — anula la duración del plan)</label>' +
          '<input type="date" id="act-manual-date" class="wp-input">' +
        '</div>' +
        '<div class="wp-footer">' +
          '<button id="act-plan-btn" class="wp-btn-primary">Aplicar</button>' +
          '<button class="wp-btn-ghost" onclick="document.getElementById(\'activate-modal\').remove();">Cancelar</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if(e.target===modal) modal.remove(); });

  document.getElementById('act-plan-btn').addEventListener('click', function() {
    var val = document.getElementById('act-plan-sel').value.split('|');
    var planId = val[0];
    var variantId = val[1] || null;
    var planDef = _planById(planId);
    var variantDef = (variantId && planDef && planDef.variants) ? planDef.variants.find(function(v){ return v.id === variantId; }) : null;
    var keepDates = document.getElementById('act-keep-dates').checked;
    var manualDate = document.getElementById('act-manual-date').value;
    var btn = this;
    btn.disabled = true; btn.textContent = 'Aplicando...';

    var updateData = {
      plan: planId,
      access_1on1: planDef ? !!planDef.access_1on1 : false,
      roadmap_mode: planDef ? planDef.roadmap_mode : null
    };
    if (!keepDates) {
      var accessClases = variantDef && variantDef.access_clases !== null ? variantDef.access_clases : (planDef ? planDef.access_clases !== false : true);
      var durClases = variantDef ? variantDef.duration_clases_months : (planDef ? planDef.duration_clases_months : null);
      var durLive = variantDef ? variantDef.duration_live_months : (planDef ? planDef.duration_live_months : null);
      var now = new Date();

      if (manualDate) {
        updateData.membership_start = now.toISOString();
        updateData.membership_end = new Date(manualDate + 'T23:59:59').toISOString();
      } else if (!accessClases) {
        updateData.membership_start = null;
        updateData.membership_end = null;
      } else {
        updateData.membership_start = now.toISOString();
        updateData.membership_end = durClases ? (function(){ var e=new Date(); e.setMonth(e.getMonth()+durClases); return e.toISOString(); })() : UNLIMITED_ISO;
      }
      if (durLive) {
        var liveEnd = new Date(); liveEnd.setMonth(liveEnd.getMonth() + durLive);
        updateData.live_plan = planId; updateData.live_end = liveEnd.toISOString();
      }
    }
    sb.from('profiles').update(updateData).eq('id', id).then(function(r) {
      modal.remove();
      if (r.error) return tst('Error: ' + r.error.message, 1);
      tst('✓ Plan actualizado');
      rAdmSt();
    });
  });
}

  var btn = document.getElementById('em-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }

  var title = (document.getElementById('em-title')||{}).value || '';
  if (!title.trim()) { tst('El título es requerido', 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }

  if (type === 'level') {
    var thumbnailUrl = data ? (data.thumbnail_url || '') : '';
    var fileInput = document.getElementById('em-img-file');
    var file = fileInput && fileInput.files[0];
    if (file) {
      tst('Subiendo imagen...');
      var ext = file.name.split('.').pop();
      var path = 'levels/' + (data ? data.id : Date.now()) + '_' + Date.now() + '.' + ext;
      var up = await sb.storage.from('course-images').upload(path, file, { upsert: true });
      if (up.error) { tst('Error imagen: ' + up.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      thumbnailUrl = sb.storage.from('course-images').getPublicUrl(path).data.publicUrl;
    }
    var payload = {
      title: title.trim(),
      description: (document.getElementById('em-desc')||{}).value || '',
      thumbnail_url: thumbnailUrl,
      sort_order: parseInt((document.getElementById('em-ord')||{}).value) || 1,
      is_published: (document.getElementById('em-pub')||{}).checked !== false,
      is_controlled: (document.getElementById('em-controlled')||{}).checked || false,
    };
    var q = data ? sb.from('course_levels').update(payload).eq('id', data.id) : sb.from('course_levels').insert(payload);
    q.then(function(r) {
      if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      tst(data ? '✓ Nivel actualizado' : '✓ Nivel creado');
      closeEditModal(); _afterCourseEdit();
    });

  } else if (type === 'module') {
    var lvId = data ? data.level_id : parentLvId;
    if (!lvId) { tst('Sin nivel asignado', 1); return; }
    var unlockWeekVal = (document.getElementById('em-unlock')||{}).value;
    var payload2 = {
      title: title.trim(),
      description: (document.getElementById('em-desc')||{}).value || '',
      sort_order: parseInt((document.getElementById('em-ord')||{}).value) || 1,
      level_id: lvId,

    };
    var q2 = data ? sb.from('course_modules').update(payload2).eq('id', data.id) : sb.from('course_modules').insert(payload2);
    q2.then(function(r) {
      if (r.error) { tst('Error: '+r.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
      tst(data ? '✓ Módulo actualizado' : '✓ Módulo creado');
      closeEditModal(); _afterCourseEdit();
    });

  } else if (type === 'lesson') {
    var modId = (data && data.module_id) ? data.module_id : parentModId;
    if (!modId) { tst('Sin módulo asignado', 1); return; }

    // Handle thumbnail upload/delete for lesson
    var lesThumbUrl = data ? (data.thumbnail_url || '') : '';

    if (lesThumbDel) {

        var lesUp = await sb.storage.from('course-images').upload(lesPath, lesThumbFileObj, { upsert: true });
        if (lesUp.error) { tst('Error miniatura: ' + lesUp.error.message, 1); if(btn){btn.disabled=false;btn.textContent='Guardar cambios';} return; }
        lesThumbUrl = sb.storage.from('course-images').getPublicUrl(lesPath).data.publicUrl;

    var payload3 = {
      title: title.trim(),

      description: (document.getElementById('em-desc')||{}).value || '',

      module_id: modId,
    };
    var q3 = data ? sb.from('course_lessons').update(payload3).eq('id', data.id) : sb.from('course_lessons').insert(payload3);
    q3.then(function(r) {

function _switchCodesSubtab(tab) {
  document.querySelectorAll('.wp-subtab-btn[data-subtab]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.subtab === tab);
  });
  document.querySelectorAll('.codes-subtab-panel').forEach(function(p) {
    var on = p.id === 'codes-subtab-' + tab;
    p.style.display = on ? '' : 'none';
    if (on) _tabFx(p);
  });
  var b0 = document.querySelector('.wp-subtab-btn[data-subtab]');
  if (b0) _tabInk(b0.parentNode);
}

// Línea dorada que se desliza bajo la pestaña activa (pestañas estilo Planes)
function _tabInk(wrap) {
  if (!wrap) return;
  var ink = wrap.querySelector('.wp-ink'), fresh = !ink;
  if (fresh) { ink = document.createElement('span'); ink.className = 'wp-ink'; wrap.appendChild(ink); wrap.classList.add('has-ink'); }
  var a = wrap.querySelector('.wp-subtab-btn.active');
  if (fresh) ink.style.transition = 'none';
  ink.style.width = a ? a.offsetWidth + 'px' : '0';
  ink.style.transform = 'translateX(' + (a ? a.offsetLeft : 0) + 'px)';
  if (fresh) { void ink.offsetWidth; ink.style.transition = ''; }
}
// Entrada suave del contenido al cambiar de pestaña
function _tabFx(el) {
  if (!el) return;
  el.classList.remove('tab-in'); void el.offsetWidth; el.classList.add('tab-in');
}

async function syncDiscordRoles() {
  var btn = document.getElementById('btn-sync-discord-roles');
  var originalText = btn.textContent;
  btn.textContent = 'Sincronizando...';
  btn.disabled = true;
  try {
    var session = await sb.auth.getSession();
    var token = session && session.data && session.data.session ? session.data.session.access_token : '';
    var res = await fetch('/api/discord-roles', { headers: { Authorization: 'Bearer ' + token } });
    var data = await res.json();
    if (!res.ok || data.error) {
      tst('Error al sincronizar: ' + (data.error || res.status), 1);
    } else {
      tst('✓ ' + data.count + ' roles sincronizados desde Discord');
      loadDiscordRoles();
    }
  } catch (e) {
    tst('Error al sincronizar roles', 1);
  }
  btn.textContent = originalText;
  btn.disabled = false;
}

          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  });
}

function togglePlan(planId, currentActive) {
  sb.from('checkout_plans').update({ active: !currentActive }).eq('id', planId).then(function(r) {
    if (r.error) return tst('Error: ' + r.error.message, 1);
    tst('✓ Plan ' + (!currentActive ? 'publicado' : 'ocultado'));
    loadPlansAdmin();
  });
}

    '.wp-subtab-btn.active{color:var(--sl);border-bottom-color:var(--sl);}';
  document.head.appendChild(style);

  // Bloquea el scroll de la página de fondo mientras haya algún modal (.wp-overlay)
  // abierto — evita el "rebote"/estiramiento de iOS/Safari cuando el modal necesita
  // scroll interno porque es más alto que la pantalla. Se activa/desactiva solo,
  // sin tener que tocar cada función de modal individualmente.
  var _wpScrollY = 0;
  function _wpLockBody() {
    _wpScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = '-' + _wpScrollY + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  function _wpUnlockBody() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, _wpScrollY);
  }
  var _wpObserver = new MutationObserver(function() {
    var hasOverlay = !!document.querySelector('.wp-overlay');
    var isLocked = document.body.style.position === 'fixed';
    if (hasOverlay && !isLocked) _wpLockBody();
    else if (!hasOverlay && isLocked) _wpUnlockBody();
  });
  _wpObserver.observe(document.body, { childList: true });
}

        // Card: Variantes
        '<div class="wp-card">' +

            '<div style="display:flex;align-items:center;gap:9px;"><span class="wp-card-icon">🔀</span><span class="wp-card-title">Variantes (ej. duraciones de Live)</span></div>' +
